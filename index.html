 :root {
  --mq4-bg: #020617;
  --mq4-ink: #f0f9ff;
  --mq4-muted: rgba(224, 242, 254, 0.78);
  --mq4-faint: rgba(224, 242, 254, 0.58);
  --mq4-heading: #e0f2fe;
  --mq4-glow: rgba(0, 225, 255, 0.75);
  --mq4-rose: #bae6fd;
  --mq4-caption: #7dd3fc;
  --mq4-pink: #00e5ff;
  --mq4-pink-deep: #0284c7;
  --mq4-hot: #38bdf8;
  --mq4-cyan: #00e5ff;
  --mq4-cyan-deep: #0284c7;
  --mq4-ice: #e0f2fe;
  --mq4-amber: #f59e0b;
  --mq4-amber-deep: #d97706;
  --mq4-honey: #fef08a;
  --mq4-line: rgba(56, 189, 248, 0.22);
  --mq4-line-soft: rgba(56, 189, 248, 0.12);
  --mq4-line-strong: rgba(56, 189, 248, 0.55);
  --mq4-fill: rgba(56, 189, 248, 0.04);
  --mq4-fill-hover: rgba(56, 189, 248, 0.16);

  --mq4-font: "Space Grotesk", "Saira", system-ui, -apple-system, sans-serif;
  --mq4-font-pixel: "Orbitron", "Space Grotesk", monospace, sans-serif;

  --mq4-fs-small: 0.82rem;
  --mq4-fs-kicker: 0.95rem;
  --mq4-fs-body: 1.05rem;
  --mq4-fs-lead: clamp(1.05rem, 0.9rem + 0.45vw, 1.35rem);
  --mq4-fs-title: clamp(2.5rem, 1.6rem + 3vw, 4rem);
  --mq4-glow-text:
    0 0 1px rgba(255, 255, 255, 0.9),
    0 0 8px var(--mq4-glow),
    0 0 20px rgba(0, 225, 255, 0.35);

  --mq4-r-sm: 4px;
  --mq4-r-md: 8px;
  --mq4-r-lg: 18px;
  --mq4-r-xl: 22px;
  /* Buttons, fields, cards and panels in the page sections. */
  --mq4-r-ui: 12px;

  --mq4-gutter: clamp(1.25rem, 6vw, 6rem);
  /* Story copy sits in a centred stage of at most 2:1, so on ultra-wide screens it stays near the cabinet. */
  --mq4-stage: min(100vw, 200vh);
  --mq4-edge: max(calc((100vw - var(--mq4-stage)) / 2 + var(--mq4-stage) * 0.06), var(--mq4-safe-left));
  --mq4-edge-r: max(calc((100vw - var(--mq4-stage)) / 2 + 1.5rem), var(--mq4-safe-right));
  --mq4-max: 76rem;
  --mq4-section: clamp(3.5rem, 2.5rem + 4vw, 6.5rem);

  --mq4-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mq4-ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --mq4-ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);

  --mq4-safe-top: env(safe-area-inset-top, 0px);
  --mq4-safe-right: env(safe-area-inset-right, 0px);
  --mq4-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mq4-safe-left: env(safe-area-inset-left, 0px);
}

body {

}

body {

  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* Loader: a small arcade "LOADING" readout with a chunky block bar. */
.mq4-loader {
  --p: 0;
  --q: 0;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background:
    radial-gradient(40vw 30vh at 50% 50%, rgba(255, 57, 159, 0.16), transparent 70%),
    var(--mq4-bg);
  font-family: var(--mq4-font-pixel);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.mq4-loader.is-open {
  opacity: 0;
  visibility: hidden;
}

.mq4-loader__box {
  display: grid;
  gap: 0.9rem;
  width: min(19rem, 72vw);
}

.mq4-loader__label,
.mq4-loader__pct {
  display: flex;
  justify-content: flex-start;
  margin: 0;
  color: var(--mq4-heading);
  font-size: 0.72rem;
  line-height: 1;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(255, 57, 159, 0.65);
}

.mq4-loader__label::after {
  content: "";
  width: 0.62em;
  height: 1em;
  margin-left: 0.4em;
  background: var(--mq4-pink);
  box-shadow: 0 0 8px var(--mq4-pink);
  animation: mq4-loader-blink 1s steps(1, end) infinite;
}

.mq4-loader__pct {
  justify-content: flex-end;
  color: var(--mq4-caption);
  font-variant-numeric: tabular-nums;
}

/* A thin neon line around the blocks, like the tubes on the rest of the site. */
.mq4-loader__bar {
  position: relative;
  height: 1.25rem;
  padding: 3px;
  border: 1px solid rgba(255, 57, 159, 0.75);
  border-radius: var(--mq4-r-sm);
  background: rgba(3, 2, 7, 0.9);
  box-shadow:
    0 0 14px rgba(255, 57, 159, 0.35),
    inset 0 0 8px rgba(255, 57, 159, 0.15);
}

/*
 * 20 blocks running from pink to purple, the neon colours of the site. --q is
 * the progress rounded down to whole blocks, so the bar fills in steps.
 */
.mq4-loader__fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mq4-pink), #e84bdc 55%, #b86bff);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  filter: drop-shadow(0 0 6px rgba(255, 57, 159, 0.8));
  clip-path: inset(0 calc(100% - var(--q) * 100%) 0 0);
}

.mq4-loader__error {
  margin: 0;
  color: var(--mq4-muted);
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  text-align: center;
}

@keyframes mq4-loader-blink {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mq4-loader,
  .mq4-loader.is-open {
    transition: none;
  }

  .mq4-loader__label::after {
    animation: none;
  }
}

/* ==========================================================================
   PREMIUM HOLOGRAPHIC GLASS CARDS
   ========================================================================== */

.naigc-glass-card {
  position: relative;
  display: flex;
  align-items: center;
  text-decoration: none;
  box-sizing: border-box;
  width: 100%;
  max-width: 415px;
  height: 92px;
  border-radius: 14px;
  border: 1px solid var(--naigc-glass-border);
  background: var(--naigc-glass-surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 
    0 8px 32px rgba(2, 8, 20, 0.45),
    0 0 16px rgba(32, 223, 255, 0.08),
    inset 0 1px 0 rgba(180, 235, 255, 0.15),
    inset 0 0 12px rgba(180, 235, 255, 0.04);
  cursor: pointer;
  overflow: hidden;
  transition: 
    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
    background 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}

/* Soft Upper-Edge Reflection */
.naigc-glass-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 16px;
  right: 16px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(180, 235, 255, 0.35), transparent);
  pointer-events: none;
  z-index: 2;
}

/* Moving Glass Reflection Sheen on Hover */
.naigc-glass-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -130%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
  transform: skewX(-20deg);
  pointer-events: none;
  z-index: 3;
}

.naigc-glass-card:hover::after {
  left: 170%;
  transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Hover Interaction: Elegant Floating Depth */
.naigc-glass-card:hover {
  transform: translateY(-4px);
  background: var(--naigc-glass-surface-hover);
  border-color: var(--naigc-glass-border-hover);
  box-shadow: 
    0 14px 40px rgba(2, 10, 26, 0.6),
    0 0 24px rgba(32, 223, 255, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 0 16px rgba(32, 223, 255, 0.08);
}

/* Card Inner Content Container */
.naigc-glass-inner {
  display: flex;
  align-items: center;
  gap: 0.95rem;
  width: 100%;
  height: 100%;
  padding: 0.75rem 1.15rem;
  box-sizing: border-box;
  position: relative;
  z-index: 4;
}

.naigc-card-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: var(--naigc-ice-white);
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.25s ease;
}

/* Description */
.naigc-card-desc {
  margin: 0;
  color: var(--naigc-desc-muted);
  font-size: 0.73rem;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.25s ease;
}

.naigc-glass-card:hover .naigc-card-desc {
  color: #D2E4F0;
}

/* Subtle Arrow Indicator on Far Right */
.naigc-card-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--naigc-cyan);
  opacity: 0.3;
  transform: translateX(0);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  margin-left: 0.25rem;
}

.naigc-theme-violet .naigc-card-arrow {
  color: var(--naigc-violet);
}

.naigc-card-arrow svg {
  width: 17px;
  height: 17px;
}

.naigc-glass-card:hover .naigc-card-arrow {
  opacity: 0.95;
  transform: translateX(4px);
}

/* ==========================================================================
   CONNECTING TRACE LINES & PULSE NODES (PRESERVED)
   ========================================================================== */

.naigc-trace-line {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}

.naigc-trace-right {
  right: -32px;
}

.naigc-trace-left {
  left: -32px;
}

.naigc-trace-beam {
  display: block;
  width: 24px;
  height: 2px;
  background: linear-gradient(90deg, var(--naigc-cyan), rgba(32, 223, 255, 0.15));
  box-shadow: 0 0 8px rgba(32, 223, 255, 0.4);
}

.naigc-trace-left .naigc-trace-beam {
  background: linear-gradient(90deg, rgba(32, 223, 255, 0.15), var(--naigc-cyan)) !important;
}

.naigc-trace-node {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px var(--naigc-cyan), 0 0 16px var(--naigc-cyan);
}

.naigc-theme-violet .naigc-trace-beam {
  background: linear-gradient(90deg, var(--naigc-violet), rgba(168, 121, 255, 0.15));
  box-shadow: 0 0 8px rgba(168, 121, 255, 0.4);
}

.naigc-theme-violet .naigc-trace-left .naigc-trace-beam {
  background: linear-gradient(90deg, rgba(168, 121, 255, 0.15), var(--naigc-violet)) !important;
}

.naigc-theme-violet .naigc-trace-node {
  box-shadow: 0 0 10px var(--naigc-violet), 0 0 16px var(--naigc-violet);
}

/* ==========================================================================
   RESPONSIVE DESIGN
   ========================================================================== */

@media (max-width: 1280px) {
  .naigc-pillars-container {
    grid-template-columns: minmax(310px, 360px) 1fr minmax(310px, 360px);
    padding: 0 1rem;
  }
  .naigc-glass-card {
    height: 86px;
  }
  .naigc-card-title {
    font-size: 0.82rem;
  }
  .naigc-card-desc {
    font-size: 0.69rem;
  }
  .naigc-icon-box {
    width: 42px;
    height: 42px;
    min-width: 42px;
  }
  .naigc-icon-box svg {
    width: 20px;
    height: 20px;
  }
  .naigc-trace-line {
    display: none;
  }
}

@media (max-width: 860px) {
  .naigc-pillars-container {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: auto;
    max-height: none;
    padding-bottom: 2rem;
    gap: 0.75rem;
  }
  .naigc-pillars-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    width: 100%;
  }
  .naigc-pillars-center {
    display: none;
  }
  .naigc-glass-card {
    height: 74px;
    border-radius: 12px;
  }
  .naigc-glass-inner {
    padding: 0.5rem 0.75rem;
    gap: 0.65rem;
  }
  .naigc-card-badge {
    font-size: 0.60rem;
    padding: 1px 5px;
  }
  .naigc-icon-box {
    width: 36px;
    height: 36px;
    min-width: 36px;
  }
  .naigc-icon-box svg {
    width: 18px;
    height: 18px;
  }
  .naigc-card-title {
    font-size: 0.75rem;
  }
  .naigc-card-desc {
    display: none;
  }
  .naigc-card-arrow {
    display: none;
  }
}

    <h1>MemoryQuest: arcade photo booth hire for your party</h1>
    <p>Interactive Holographic AI Experience Terminal: Neural Avatars, Generative Motion, Voice Synthesis & Turing Battles. Discover the possibilities of artificial intelligence, emerging technologies and ideas shaping tomorrow</p>

    <h2>Games</h2>
    <ul>
        <li><strong>Photo</strong>: with backgrounds, effects and frames.</li>
        <li><strong>Video</strong>: short clips, with effects too.</li>
        <li><strong>Audio</strong>: record a wish or a message.</li>
        <li><strong>Challenge</strong>: the machine hands out a dare, you decide beforehand which ones.</li>
        <li><strong>Boomerang</strong>: your clip forwards and backwards.</li>
        <li><strong>Cartoon</strong>: your photo in a drawing style.</li>
        <li><strong>Karaoke</strong>: sing along, recorded.</li>
        <li><strong>Quizbattle</strong>: your own questions, answered with A, B, C or D, with a leaderboard.</li>
    </ul>

    <h2>Your party, your style</h2>
    <p>In the configurator you give the machine your colours, logo, texts and images, and you choose which games, challenges, backgrounds and effects guests come across. Custom wraps for the outside of the machine are available on request.</p>

    <h2>Pricing</h2>
    <ul>
        <li><strong>Basic</strong>: €275 per day. Photo, video, boomerang, audio, challenges, backgrounds and classic effects. 3 backgrounds of your own (1 of them made with AI) and 1 frame of your own.</li>
        <li><strong>Plus</strong>: €375 per day. Everything in Basic, plus the Quizbattle with a leaderboard, AI cartoons of your guests (100 per party), AI backgrounds and styles made by guests (3 per guest), and more backgrounds, frames and cartoon styles of your own.</li>
        <li><strong>All-in</strong>: €475 per day. Everything in Plus, plus karaoke, unlimited cartoons, 5 AI backgrounds and styles per guest and the most backgrounds, frames and cartoon styles of your own.</li>
    </ul>
    <p>Setup is always included. <strong>Prices apply within 25 km of Hardenberg, the Netherlands.</strong> Beyond that, travel costs are on request.</p>

    <h2>Frequently asked questions</h2>
    <h3>Do guests need to install anything?</h3>
    <p>No. The QR code opens a mobile page where they enter their name and see their memories again.</p>
    <h3>Who gets to see the memories?</h3>
    <p>The host can look back at every memory of the event. Guests see their own collection.</p>
    <h3>How does the Quizbattle work?</h3>
    <p>The Quizbattle is a quiz with your own questions, played on the arcade machine’s buttons. You write the questions in the configurator and set the time for each one. Guests who signed in with the QR code play once and answer with A, B, C or D. Whoever gets the most right, and fastest, tops the leaderboard. Included in Plus and All-in.</p>
    <h3>What happens after booking?</h3>
    <p>After payment you get a link to finish setting up your event in the configurator. Setup on the day is included.</p>
    <h3>Do you travel further?</h3>
    <p>Yes. Prices apply within 25 km of Hardenberg. Beyond that, travel costs are on request.</p>

    <p>Turn on JavaScript to check availability and book straight away.</p>

    <h2>Contact</h2>
    <p>Email: <a href="mailto:info@build2connect.nl" style="color:inherit">info@build2connect.nl</a><br>Phone: <a href="tel:+31523297001" style="color:inherit">+31 (0)523 297 001</a></p>
    <p>Design and development by <a href="https://www.build2connect.nl/" style="color:inherit">Build2Connect</a></p>
