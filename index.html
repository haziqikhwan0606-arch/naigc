 :root {

    0 0 1px rgba(255, 255, 255, 0.9),

  --mq4-r-md: 8px;

  --mq4-r-ui: 12px;

  --mq4-ease-expo: cubic-bezier(0.16, 1, 0.3, 1);

/* Loader: a small arcade "LOADING" readout with a chunky block bar. */
.mq4-loader {
  --p: 0;
  --q: 0;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background:
    radial-gradient(40vw 30vh at 50% 50%, rgba(255, 57, 159, 0.16), transparent 70%),
    var(--mq4-bg);
  font-family: var(--mq4-font-pixel);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.mq4-loader.is-open {
  opacity: 0;
  visibility: hidden;
}

.mq4-loader__box {
  display: grid;
  gap: 0.9rem;
  width: min(19rem, 72vw);
}

.mq4-loader__label,
.mq4-loader__pct {
  display: flex;
  justify-content: flex-start;
  margin: 0;
  color: var(--mq4-heading);
  font-size: 0.72rem;
  line-height: 1;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(255, 57, 159, 0.65);
}

.mq4-loader__label::after {
  content: "";
  width: 0.62em;
  height: 1em;
  margin-left: 0.4em;
  background: var(--mq4-pink);
  box-shadow: 0 0 8px var(--mq4-pink);
  animation: mq4-loader-blink 1s steps(1, end) infinite;
}

.mq4-loader__pct {
  justify-content: flex-end;
  color: var(--mq4-caption);
  font-variant-numeric: tabular-nums;
}

/* A thin neon line around the blocks, like the tubes on the rest of the site. */
.mq4-loader__bar {
  position: relative;
  height: 1.25rem;
  padding: 3px;
  border: 1px solid rgba(255, 57, 159, 0.75);
  border-radius: var(--mq4-r-sm);
  background: rgba(3, 2, 7, 0.9);
  box-shadow:
    0 0 14px rgba(255, 57, 159, 0.35),
    inset 0 0 8px rgba(255, 57, 159, 0.15);
}

/*
 * 20 blocks running from pink to purple, the neon colours of the site. --q is
 * the progress rounded down to whole blocks, so the bar fills in steps.
 */
.mq4-loader__fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mq4-pink), #e84bdc 55%, #b86bff);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  filter: drop-shadow(0 0 6px rgba(255, 57, 159, 0.8));
  clip-path: inset(0 calc(100% - var(--q) * 100%) 0 0);
}

.mq4-loader__error {
  margin: 0;
  color: var(--mq4-muted);
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  text-align: center;
}

@keyframes mq4-loader-blink {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mq4-loader,
  .mq4-loader.is-open {
    transition: none;
  }

  .mq4-loader__label::after {
    animation: none;
  }
}

/* ==========================================================================
   LAYER 1 & 2: ANGULAR HOLOGRAPHIC PROJECTION SHELL
   ========================================================================== */

.naigc-holo-projection {
  position: relative;
  display: flex;
  align-items: center;
  text-decoration: none;
  box-sizing: border-box;
  width: 100%;
  max-width: 485px;
  height: 96px;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
}

/* Spatial 3D Command-Centre Perspective Suspended in Space */
.naigc-proj-left {
  transform: perspective(1000px) rotateY(6deg) rotateX(1deg);
  transform-origin: right center;
}

.naigc-proj-right {
  transform: perspective(1000px) rotateY(-6deg) rotateX(1deg);
  transform-origin: left center;
}

/* Staggered Spatial Depths */
.naigc-pillars-col a:nth-child(1) { transform: perspective(1000px) rotateY(6deg) translateZ(-6px); }
.naigc-pillars-col a:nth-child(2) { transform: perspective(1000px) rotateY(6deg) translateZ(10px); }
.naigc-pillars-col a:nth-child(3) { transform: perspective(1000px) rotateY(6deg) translateZ(14px); }
.naigc-pillars-col a:nth-child(4) { transform: perspective(1000px) rotateY(6deg) translateZ(-2px); }

.naigc-pillars-right a:nth-child(1) { transform: perspective(1000px) rotateY(-6deg) translateZ(-6px); }
.naigc-pillars-right a:nth-child(2) { transform: perspective(1000px) rotateY(-6deg) translateZ(10px); }
.naigc-pillars-right a:nth-child(3) { transform: perspective(1000px) rotateY(-6deg) translateZ(14px); }
.naigc-pillars-right a:nth-child(4) { transform: perspective(1000px) rotateY(-6deg) translateZ(-2px); }

/* Floating Offset Secondary Frame */
.naigc-offset-frame {
  position: absolute;
  inset: -6px -8px;
  pointer-events: none;
  z-index: 2;
  transition: all 0.3s ease;
}

.naigc-tech-bracket {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0.75;
  transition: all 0.3s ease;
}

.naigc-theme-cyan .naigc-tech-bracket {

}

.naigc-theme-violet .naigc-tech-bracket {

}

  left: 0;

  border-left: 2px solid;
}

.naigc-bracket-bl {

/* ==========================================================================
   ANGULAR TRAPEZOIDAL / ASYMMETRIC POLYGON GEOMETRY
   ========================================================================== */

/* Outer Polygon Border Frame */
.naigc-poly-border {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 1.5px;
  position: relative;
  transition: all 0.3s ease;
}

/* Left Panels Polygon: Cut corners on left, Tapered apex facing Cyborg on right */
.naigc-proj-left .naigc-poly-border {
  clip-path: polygon(
    22px 0%, 
    calc(100% - 28px) 0%, 
    100% 50%, 
    calc(100% - 28px) 100%, 
    22px 100%, 
    0% calc(100% - 22px), 
    0% 22px
  );
}

.naigc-proj-left .naigc-poly-surface {
  clip-path: polygon(
    21px 0%, 
    calc(100% - 27px) 0%, 
    99.2% 50%, 
    calc(100% - 27px) 100%, 
    21px 100%, 
    0% calc(100% - 21px), 
    0% 21px
  );
  padding: 0.75rem 2.4rem 0.75rem 1.15rem;
}

/* Right Panels Polygon: Cut corners on right, Tapered apex facing Cyborg on left */
.naigc-proj-right .naigc-poly-border {
  clip-path: polygon(
    28px 0%, 
    calc(100% - 22px) 0%, 
    100% 22px, 
    100% calc(100% - 22px), 
    calc(100% - 22px) 100%, 
    28px 100%, 
    0% 50%
  );
}

.naigc-proj-right .naigc-poly-surface {
  clip-path: polygon(
    27px 0%, 
    calc(100% - 21px) 0%, 
    100% 21px, 
    100% calc(100% - 21px), 
    calc(100% - 21px) 100%, 
    27px 100%, 
    0.8% 50%
  );
  padding: 0.75rem 1.15rem 0.75rem 2.4rem;
}

/* Base Poly Surface (Shared Smoked Sapphire Glass) */
.naigc-poly-surface {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  background: var(--naigc-surface-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  display: flex;
  align-items: center;
  gap: 0.85rem;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.22), 
              inset 0 -1px 2px rgba(0, 0, 0, 0.5),
              0 14px 40px rgba(0, 10, 32, 0.45);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Internal Micro-Grid & Holographic Texture */
.naigc-poly-grid {
  position: absolute;
  inset: 0;
  background-image: 
    repeating-linear-gradient(0deg, rgba(0, 217, 255, 0.045) 0px, rgba(0, 217, 255, 0.045) 1px, transparent 1px, transparent 4px),
    linear-gradient(90deg, rgba(0, 217, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 4px, 16px 100%;
  pointer-events: none;
  z-index: 1;
}

/* Vertical Scanning Beam Animation */
.naigc-scan-beam {
  position: absolute;
  top: -40%;
  left: 0;
  right: 0;
  height: 16px;
  background: linear-gradient(180deg, transparent, rgba(0, 217, 255, 0.22), transparent);
  pointer-events: none;
  z-index: 2;
  animation: naigc-scan-anim 4.2s infinite ease-in-out;
}

.naigc-theme-violet .naigc-scan-beam {
  background: linear-gradient(180deg, transparent, rgba(168, 85, 247, 0.22), transparent);
}

@keyframes naigc-scan-anim {
  0% { top: -40%; }
  50% { top: 120%; }
  100% { top: 120%; }
}

/* ==========================================================================
   INTERNAL HOLOGRAPHIC COMPONENTS: BADGE, ICON, TEXT, ARROW
   ========================================================================== */

/* Pillar Number Badge */
.naigc-badge-capsule {
  position: absolute;
  top: 7px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  border-radius: 2px;
  z-index: 5;
}

.naigc-proj-left .naigc-badge-capsule {
  left: 14px;
}

.naigc-proj-right .naigc-badge-capsule {
  right: 14px;
}

.naigc-theme-cyan .naigc-badge-capsule {
  background: rgba(0, 217, 255, 0.20);
  border: 1px solid rgba(0, 217, 255, 0.55);
  box-shadow: 0 0 8px rgba(0, 217, 255, 0.3);
  color: #00D9FF;
}

.naigc-theme-violet .naigc-badge-capsule {
  background: rgba(168, 85, 247, 0.20);
  border: 1px solid rgba(168, 85, 247, 0.55);
  box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
  color: #C084FC;
}

.naigc-badge-num {
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  line-height: 1.2;
}

.naigc-badge-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 4px currentColor;
}

/* Faceted Hexagonal Icon Chamber */
.naigc-icon-chamber {
  width: 50px;
  height: 50px;
  min-width: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  position: relative;
  z-index: 5;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

.naigc-theme-cyan .naigc-icon-chamber {
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.22) 0%, rgba(6, 24, 58, 0.92) 100%);
  border: 1px solid rgba(0, 217, 255, 0.55);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 14px rgba(0, 217, 255, 0.28);
  color: #00D9FF;
}

.naigc-theme-violet .naigc-icon-chamber {
  background: linear-gradient(135deg, rgba(192, 132, 252, 0.22) 0%, rgba(26, 8, 52, 0.92) 100%);
  border: 1px solid rgba(192, 132, 252, 0.55);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 14px rgba(168, 85, 247, 0.28);
  color: #C084FC;
}

.naigc-icon-chamber svg {
  width: 23px;
  height: 23px;
  filter: drop-shadow(0 0 6px currentColor);
}

/* Typography Body */
.naigc-poly-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.2rem;
  flex: 1;
  min-width: 0;
  z-index: 5;
  padding-top: 4px;
}

.naigc-poly-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: #FFFFFF !important;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0.035em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: visible;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 217, 255, 0.35);
  transition: color 0.25s ease;
}

.naigc-theme-violet .naigc-poly-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: #FFFFFF !important;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0.035em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: visible;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(168, 85, 247, 0.35);
  transition: color 0.25s ease;
}

.naigc-poly-desc {
  margin: 0;
  color: #CBD5E1 !important;
  font-size: 0.70rem;
  font-weight: 500;
  line-height: 1.35;
  white-space: nowrap;
  overflow: visible;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  transition: color 0.25s ease;
}

/* Subtle Directional Arrow Readout */
.naigc-holo-readout {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--naigc-cyan);
  opacity: 0.35;
  z-index: 5;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.naigc-theme-violet .naigc-holo-readout {
  color: var(--naigc-violet);
}

/* ==========================================================================
   HOVER & INTERACTION (DIMENSIONAL SUSPENDED FLOAT)
   ========================================================================== */

.naigc-holo-projection:hover {
  transform: perspective(1000px) rotateY(0deg) translateZ(28px) translateY(-4px) !important;
}

.naigc-theme-cyan:hover .naigc-poly-border {
  background: linear-gradient(135deg, #00D9FF 0%, #38BDF8 50%, #00D9FF 100%);
  filter: drop-shadow(0 0 16px rgba(0, 217, 255, 0.65)) drop-shadow(0 0 32px rgba(0, 217, 255, 0.35));
}

.naigc-theme-violet:hover .naigc-poly-border {
  background: linear-gradient(135deg, #C084FC 0%, #E879F9 50%, #C084FC 100%);
  filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65)) drop-shadow(0 0 32px rgba(168, 85, 247, 0.35));
}

.naigc-holo-projection:hover .naigc-poly-surface {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.42) 0%, rgba(240, 250, 255, 0.26) 50%, rgba(215, 240, 255, 0.18) 100%);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 
              0 20px 50px rgba(0, 50, 120, 0.28);
}

.naigc-holo-projection:hover .naigc-offset-frame {
  inset: -8px -11px;
}

.naigc-holo-projection:hover .naigc-icon-chamber {
  transform: scale(1.08);
}

.naigc-theme-cyan:hover .naigc-icon-chamber {
  box-shadow: 0 0 20px rgba(0, 217, 255, 0.7);
}

.naigc-theme-violet:hover .naigc-icon-chamber {
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
}

.naigc-holo-projection:hover .naigc-poly-desc {
  color: var(--naigc-ice-blue);
}

.naigc-holo-projection:hover .naigc-holo-readout {
  opacity: 1;
  transform: translateX(4px);
  filter: drop-shadow(0 0 8px currentColor);
}

/* ==========================================================================
   ANIMATED HOLOGRAPHIC NEURAL LINK TO CENTRAL CYBORG
   ========================================================================== */

.naigc-holo-neural-link {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}

.naigc-link-right {
  right: -32px;
}

.naigc-link-left {
  left: -32px;
}

.naigc-link-track {
  display: block;
  width: 24px;
  height: 2px;
  background: linear-gradient(90deg, var(--naigc-cyan), rgba(0, 217, 255, 0.15));
  box-shadow: 0 0 8px rgba(0, 217, 255, 0.5);
  position: relative;
}

.naigc-link-left .naigc-link-track {
  background: linear-gradient(90deg, rgba(0, 217, 255, 0.15), var(--naigc-cyan)) !important;
}

.naigc-theme-violet .naigc-link-track {
  background: linear-gradient(90deg, var(--naigc-violet), rgba(168, 85, 247, 0.15));
  box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
}

.naigc-theme-violet .naigc-link-left .naigc-link-track {
  background: linear-gradient(90deg, rgba(168, 85, 247, 0.15), var(--naigc-violet)) !important;
}

/* Animated Data Flow Packet */
.naigc-link-stream {
  position: absolute;
  top: -1px;
  width: 6px;
  height: 4px;
  border-radius: 2px;
  background: #ffffff;
  box-shadow: 0 0 8px #00D9FF, 0 0 14px #00D9FF;
  animation: naigc-pulse-r 2.2s infinite ease-in-out;
}

.naigc-link-left .naigc-link-stream {
  animation: naigc-pulse-l 2.2s infinite ease-in-out;
}

.naigc-theme-violet .naigc-link-stream {
  box-shadow: 0 0 8px #A855F7, 0 0 14px #A855F7;
}

@keyframes naigc-pulse-r {
  0% { left: 0%; opacity: 0; }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { left: 100%; opacity: 0; }
}

@keyframes naigc-pulse-l {
  0% { right: 0%; opacity: 0; }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { right: 100%; opacity: 0; }
}

/* Terminal Node Dot */
.naigc-link-terminal {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px var(--naigc-cyan), 0 0 18px var(--naigc-cyan);
}

.naigc-theme-violet .naigc-link-terminal {
  box-shadow: 0 0 10px var(--naigc-violet), 0 0 18px var(--naigc-violet);
}

/* ==========================================================================
   RESPONSIVE DESIGN
   ========================================================================== */

@media (max-width: 1280px) {
  .naigc-pillars-container {
    grid-template-columns: minmax(310px, 360px) 1fr minmax(310px, 360px);
    padding: 0 1rem;
  }
  .naigc-holo-projection {
    height: 88px;
    transform: none !important;
  }
  .naigc-poly-title {
    font-size: 0.82rem;
  }
  .naigc-poly-desc {
    font-size: 0.69rem;
  }
  .naigc-icon-chamber {
    width: 44px;
    height: 44px;
    min-width: 44px;
  }
  .naigc-icon-chamber svg {
    width: 21px;
    height: 21px;
  }
  .naigc-holo-neural-link {
    display: none;
  }
}

@media (max-width: 860px) {
  .naigc-pillars-container {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    max-height: none;
    padding-bottom: 2rem;
    gap: 0.75rem;
  }
  .naigc-pillars-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    width: 100%;
  }
  .naigc-pillars-center {
    display: none;
  }
  .naigc-holo-projection {
    height: 76px;
    transform: none !important;
  }
  .naigc-poly-surface {
    padding: 0.5rem 0.75rem !important;
    gap: 0.65rem;
  }
  .naigc-badge-capsule {
    top: 4px;
  }
  .naigc-badge-num {
    font-size: 0.58rem;
  }
  .naigc-icon-chamber {
    width: 36px;
    height: 36px;
    min-width: 36px;
  }
  .naigc-icon-chamber svg {
    width: 18px;
    height: 18px;
  }
  .naigc-poly-title {
    font-size: 0.75rem;
  }
  .naigc-poly-desc {
    display: none;
  }
  .naigc-holo-readout {
    display: none;
  }
}


/* ==========================================================================
   LUSION.CO SCREENPAINT — LIQUID CHROMATIC DISPERSION TRAIL

#lusion-screenpaint-canvas {
  position: fixed;

  left: 0;

  will-change: transform;
}

.naigc-holo-projection.is-card-tilted {
  transition: transform 0.08s ease-out;
}

<script>
/**
 * LUSION.CO SCREENPAINT ENGINE — LIQUID IRIDESCENT RIBBON & CHROMATIC ABERRATION
 * Recreates the exact signature effect from lusion.co/projects:
 * - Fluid ribbon spline trailing the cursor
 * - Multi-pass spectral chromatic aberration (Cyan, Magenta, Amber, Liquid Specular)
 * - Organic dissipation & curl noise physics
 * - Native pointer responsiveness (zero lag)
 */
(function initLusionScreenPaint() {
  if (typeof window === "undefined") return;

  // Create High-Performance GPU Canvas
  const canvas = document.createElement("canvas");
  canvas.id = "lusion-screenpaint-canvas";
  canvas.setAttribute("aria-hidden", "true");
  document.body.appendChild(canvas);

  const ctx = canvas.getContext("2d", { alpha: true });
  let width = (canvas.width = window.innerWidth * window.devicePixelRatio || 1);
  let height = (canvas.height = window.innerHeight * window.devicePixelRatio || 1);
  const dpr = window.devicePixelRatio || 1;

  function resize() {
    width = canvas.width = window.innerWidth * dpr;
    height = canvas.height = window.innerHeight * dpr;
  }
  window.addEventListener("resize", resize, { passive: true });

  // Mouse State & Trail Buffer
  const points = [];
  const TRAIL_LIFETIME = 850;
  const BASE_WIDTH = 12 * dpr;
  let mouseX = -1000, mouseY = -1000;
  let prevMouseX = -1000, prevMouseY = -1000;
  let isMoving = false;
  let moveTimeout = null;

  window.addEventListener("pointermove", (e) => {
    const curX = e.clientX * dpr;
    const curY = e.clientY * dpr;

    if (prevMouseX < 0) {
      prevMouseX = curX;
      prevMouseY = curY;
    }

    const vx = curX - prevMouseX;
    const vy = curY - prevMouseY;
    const speed = Math.hypot(vx, vy);

    if (speed > 1.5) {
      points.push({
        x: curX,
        y: curY,
        vx: vx,
        vy: vy,
        speed: speed,
        age: 0,
        birth: performance.now(),
        noiseOffset: (Math.random() - 0.5) * 6 * dpr
      });
      prevMouseX = curX;
      prevMouseY = curY;
    }

    mouseX = curX;
    mouseY = curY;
    isMoving = true;
    clearTimeout(moveTimeout);
    moveTimeout = setTimeout(() => { isMoving = false; }, 100);
  }, { passive: true });

  // 3D Tilt on Pillar Cards
  function bindPillarCards() {
    const cards = document.querySelectorAll(".naigc-holo-projection");
    cards.forEach((card) => {
      if (card.dataset.tiltBound) return;
      card.dataset.tiltBound = "true";

      card.addEventListener("pointerenter", () => {
        card.classList.add("is-card-tilted");
      });

      card.addEventListener("pointermove", (e) => {
        const rect = card.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = rect.top + rect.height / 2;
        const normX = (e.clientX - cardCenterX) / (rect.width / 2);
        const normY = (e.clientY - cardCenterY) / (rect.height / 2);
        const tiltX = -normY * 7;
        const tiltY = normX * 7;
        card.style.transform = `perspective(1000px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) translateZ(12px)`;
      });

      card.addEventListener("pointerleave", () => {
        card.classList.remove("is-card-tilted");
        card.style.transform = "";
      });
    });
  }
  bindPillarCards();
  const obs = new MutationObserver(bindPillarCards);
  obs.observe(document.body, { childList: true, subtree: true });

  // 60-120FPS Render Loop: Liquid Chromatic Spline Trail
  function render(now) {
    requestAnimationFrame(render);

    // Prune expired points
    while (points.length > 0 && (now - points[0].birth) > TRAIL_LIFETIME) {
      points.shift();
    }

    ctx.clearRect(0, 0, width, height);

    if (points.length < 3) return;

    // Multi-pass Chromatic Aberration Drawing
    // Pass 1: Magenta / Violet Fringe (+offset)
    // Pass 2: Cyan / Ice-Blue Fringe (-offset)
    // Pass 3: Radiant Liquid White Core
    const passes = [
      { color: "rgba(255, 45, 160, ", shift: 1.8 * dpr, blur: 8 * dpr },
      { color: "rgba(0, 235, 255, ", shift: -1.8 * dpr, blur: 7 * dpr },
      { color: "rgba(255, 255, 255, ", shift: 0, blur: 3 * dpr }
    ];

    passes.forEach((p) => {
      ctx.save();
      ctx.shadowBlur = p.blur;
      ctx.shadowColor = p.color + "0.6)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = 1; i < points.length; i++) {
        const p0 = points[i - 1];
        const p1 = points[i];

        const progress0 = Math.max(0, 1 - (now - p0.birth) / TRAIL_LIFETIME);
        const progress1 = Math.max(0, 1 - (now - p1.birth) / TRAIL_LIFETIME);
        const alpha = Math.min(progress0, progress1) * 0.85;

        if (alpha <= 0.01) continue;

        // Compute normal vector for chromatic shift & curl
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        // Dynamic width: fluid taper based on age and speed
        const w0 = Math.max(1.5 * dpr, BASE_WIDTH * Math.pow(progress0, 0.85) * Math.min(1.8, 0.8 + p0.speed * 0.016));
        const w1 = Math.max(1.5 * dpr, BASE_WIDTH * Math.pow(progress1, 0.85) * Math.min(1.8, 0.8 + p1.speed * 0.016));
        const avgWidth = (w0 + w1) * 0.5;

        // Slight curl displacement over lifetime
        const curlPhase = (now - p0.birth) * 0.005;
        const curl = Math.sin(curlPhase) * p0.noiseOffset * (1 - progress0);

        const x0 = p0.x + nx * (p.shift + curl);
        const y0 = p0.y + ny * (p.shift + curl);
        const x1 = p1.x + nx * (p.shift + curl);
        const y1 = p1.y + ny * (p.shift + curl);

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = p.shift === 0 ? avgWidth * 0.65 : avgWidth;
        ctx.strokeStyle = p.color + (alpha * (p.shift === 0 ? 0.95 : 0.75)) + ")";
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  requestAnimationFrame(render);
})();
</script>
