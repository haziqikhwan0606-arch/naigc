 :root {
  --mq4-bg: #020617;
  --mq4-ink: #f0f9ff;
  --mq4-muted: rgba(224, 242, 254, 0.78);
  --mq4-faint: rgba(224, 242, 254, 0.58);
  --mq4-heading: #e0f2fe;
  --mq4-glow: rgba(0, 225, 255, 0.75);
  --mq4-rose: #bae6fd;
  --mq4-caption: #7dd3fc;
  --mq4-pink: #00e5ff;
  --mq4-pink-deep: #0284c7;
  --mq4-hot: #38bdf8;
  --mq4-cyan: #00e5ff;
  --mq4-cyan-deep: #0284c7;
  --mq4-ice: #e0f2fe;
  --mq4-amber: #f59e0b;
  --mq4-amber-deep: #d97706;
  --mq4-honey: #fef08a;
  --mq4-line: rgba(56, 189, 248, 0.22);
  --mq4-line-soft: rgba(56, 189, 248, 0.12);
  --mq4-line-strong: rgba(56, 189, 248, 0.55);
  --mq4-fill: rgba(56, 189, 248, 0.04);
  --mq4-fill-hover: rgba(56, 189, 248, 0.16);

  --mq4-font: "Space Grotesk", "Saira", system-ui, -apple-system, sans-serif;
  --mq4-font-pixel: "Orbitron", "Space Grotesk", monospace, sans-serif;

  --mq4-fs-small: 0.82rem;
  --mq4-fs-kicker: 0.95rem;
  --mq4-fs-body: 1.05rem;
  --mq4-fs-lead: clamp(1.05rem, 0.9rem + 0.45vw, 1.35rem);
  --mq4-fs-title: clamp(2.5rem, 1.6rem + 3vw, 4rem);
  --mq4-glow-text:
    0 0 1px rgba(255, 255, 255, 0.9),
    0 0 8px var(--mq4-glow),
    0 0 20px rgba(0, 225, 255, 0.35);

  --mq4-r-sm: 4px;
  --mq4-r-md: 8px;
  --mq4-r-lg: 18px;
  --mq4-r-xl: 22px;
  /* Buttons, fields, cards and panels in the page sections. */
  --mq4-r-ui: 12px;

  --mq4-gutter: clamp(1.25rem, 6vw, 6rem);
  /* Story copy sits in a centred stage of at most 2:1, so on ultra-wide screens it stays near the cabinet. */
  --mq4-stage: min(100vw, 200vh);
  --mq4-edge: max(calc((100vw - var(--mq4-stage)) / 2 + var(--mq4-stage) * 0.06), var(--mq4-safe-left));
  --mq4-edge-r: max(calc((100vw - var(--mq4-stage)) / 2 + 1.5rem), var(--mq4-safe-right));
  --mq4-max: 76rem;
  --mq4-section: clamp(3.5rem, 2.5rem + 4vw, 6.5rem);

  --mq4-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mq4-ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --mq4-ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);

  --mq4-safe-top: env(safe-area-inset-top, 0px);
  --mq4-safe-right: env(safe-area-inset-right, 0px);
  --mq4-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mq4-safe-left: env(safe-area-inset-left, 0px);
}

html,
body {
  margin: 0;
  background: var(--mq4-bg);
  color: var(--mq4-ink);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* Loader: a small arcade "LOADING" readout with a chunky block bar. */
.mq4-loader {
  --p: 0;
  --q: 0;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background:
    radial-gradient(40vw 30vh at 50% 50%, rgba(255, 57, 159, 0.16), transparent 70%),
    var(--mq4-bg);
  font-family: var(--mq4-font-pixel);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.mq4-loader.is-open {
  opacity: 0;
  visibility: hidden;
}

.mq4-loader__box {
  display: grid;
  gap: 0.9rem;
  width: min(19rem, 72vw);
}

.mq4-loader__label,
.mq4-loader__pct {
  display: flex;
  justify-content: flex-start;
  margin: 0;
  color: var(--mq4-heading);
  font-size: 0.72rem;
  line-height: 1;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(255, 57, 159, 0.65);
}

.mq4-loader__label::after {
  content: "";
  width: 0.62em;
  height: 1em;
  margin-left: 0.4em;
  background: var(--mq4-pink);
  box-shadow: 0 0 8px var(--mq4-pink);
  animation: mq4-loader-blink 1s steps(1, end) infinite;
}

.mq4-loader__pct {
  justify-content: flex-end;
  color: var(--mq4-caption);
  font-variant-numeric: tabular-nums;
}

/* A thin neon line around the blocks, like the tubes on the rest of the site. */
.mq4-loader__bar {
  position: relative;
  height: 1.25rem;
  padding: 3px;
  border: 1px solid rgba(255, 57, 159, 0.75);
  border-radius: var(--mq4-r-sm);
  background: rgba(3, 2, 7, 0.9);
  box-shadow:
    0 0 14px rgba(255, 57, 159, 0.35),
    inset 0 0 8px rgba(255, 57, 159, 0.15);
}

/*
 * 20 blocks running from pink to purple, the neon colours of the site. --q is
 * the progress rounded down to whole blocks, so the bar fills in steps.
 */
.mq4-loader__fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mq4-pink), #e84bdc 55%, #b86bff);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  filter: drop-shadow(0 0 6px rgba(255, 57, 159, 0.8));
  clip-path: inset(0 calc(100% - var(--q) * 100%) 0 0);
}

.mq4-loader__error {
  margin: 0;
  color: var(--mq4-muted);
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  text-align: center;
}

@keyframes mq4-loader-blink {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mq4-loader,
  .mq4-loader.is-open {
    transition: none;
  }

  .mq4-loader__label::after {
    animation: none;
  }
}

/* NAIGC — 8 PILLARS REDESIGN: ULTRA-FUTURISTIC HOLOGRAPHIC HUD INTERFACE */

:root {
  --naigc-cyan-primary: #00F0FF;
  --naigc-cyan-secondary: #0077FE;
  --naigc-cyan-glow: rgba(0, 240, 255, 0.40);
  --naigc-cyan-glow-strong: rgba(0, 240, 255, 0.75);

  --naigc-purple-primary: #C084FC;
  --naigc-purple-secondary: #9333EA;
  --naigc-purple-glow: rgba(192, 132, 252, 0.40);
  --naigc-purple-glow-strong: rgba(192, 132, 252, 0.75);

  --naigc-panel-bg: linear-gradient(135deg, rgba(6, 21, 45, 0.94) 0%, rgba(3, 11, 26, 0.98) 100%);
}

/* Malaysian Skyline Background on Stage (STRICTLY LOCKED) */
.mq4-stage {
  background: 
    linear-gradient(180deg, rgba(2, 6, 23, 0.55) 0%, rgba(2, 6, 23, 0.15) 30%, rgba(2, 6, 23, 0.45) 75%, rgba(2, 6, 23, 0.95) 100%),
    url('./build/assets/kl_skyline_cyber.jpg') no-repeat center bottom / cover !important;
}

/* Hide BEYOND HUMAN text and default buttons */
.mq4-words {
  display: none !important;
}

.mq4-intro .mq4-lead,
.mq4-intro .mq4-intro__actions {
  display: none !important;
}

/* Intro Layout */
.mq4-intro {
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  inset: 0 !important;
  padding: 1.5rem 2rem !important;
  box-sizing: border-box !important;
  pointer-events: none !important;
  max-width: 100% !important;
  width: 100% !important;
}

/* Title at top center (STRICTLY LOCKED) */
.mq4-intro .mq4-title {
  margin: 0 auto !important;
  text-align: center !important;
  font-size: clamp(1.4rem, 1.2rem + 1.8vw, 2.4rem) !important;
  width: 100% !important;
  max-width: 32em !important;
  color: #ffffff !important;
  text-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 2px 4px rgba(0, 0, 0, 0.8) !important;
  letter-spacing: -0.01em !important;
  z-index: 10 !important;
  padding-top: 0.5rem !important;
}

.mq4-intro__body {
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  margin: 0 !important;
  position: relative !important;
}

/* 8 Pillars Overall Grid Container */
.naigc-pillars-container {
  display: grid;
  grid-template-columns: minmax(360px, 420px) 1fr minmax(360px, 420px);
  width: 100%;
  max-width: 1520px;
  height: calc(100vh - 120px);
  max-height: 800px;
  margin: 0 auto;
  align-items: center;
  pointer-events: none;
  box-sizing: border-box;
  padding: 0 1.5rem;
  z-index: 12;
}

/* Left & Right Columns */
.naigc-pillars-col {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
  pointer-events: auto;
  z-index: 15;
}

.naigc-pillars-center {
  min-width: 200px;
  pointer-events: none;
}

/* ==========================================================================
   FUTURISTIC HOLOGRAPHIC CHEVRON PANELS
   ========================================================================== */

.naigc-holo-card {
  position: relative;
  display: flex;
  align-items: center;
  text-decoration: none;
  box-sizing: border-box;
  width: 100%;
  max-width: 420px;
  height: 94px;
  cursor: pointer;
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), filter 0.32s ease;
}

/* Number Badge: Sleek HUD Asset Capsule */
.naigc-pillar-badge {
  position: absolute;
  top: -9px;
  z-index: 30;
  padding: 2px 9px;
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.70rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  border-radius: 4px;
  line-height: 1.25;
  clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  transition: all 0.3s ease;
}

.naigc-card-left .naigc-pillar-badge {
  left: 24px;
}

.naigc-card-right .naigc-pillar-badge {
  left: 36px;
}

/* Left Cards Chevron Geometry: Tapered Point Facing Right */
.naigc-card-left .naigc-holo-border {
  clip-path: polygon(
    16px 0%, 
    calc(100% - 22px) 0%, 
    100% 50%, 
    calc(100% - 22px) 100%, 
    16px 100%, 
    0% calc(100% - 16px), 
    0% 16px
  );
}

.naigc-card-left .naigc-holo-surface {
  clip-path: polygon(
    15px 0%, 
    calc(100% - 21px) 0%, 
    99.2% 50%, 
    calc(100% - 21px) 100%, 
    15px 100%, 
    0% calc(100% - 15px), 
    0% 15px
  );
  padding: 0.75rem 1.8rem 0.75rem 1.15rem;
}

/* Right Cards Chevron Geometry: Tapered Point Facing Left */
.naigc-card-right .naigc-holo-border {
  clip-path: polygon(
    22px 0%, 
    calc(100% - 16px) 0%, 
    100% 16px, 
    100% calc(100% - 16px), 
    calc(100% - 16px) 100%, 
    22px 100%, 
    0% 50%
  );
}

.naigc-card-right .naigc-holo-surface {
  clip-path: polygon(
    21px 0%, 
    calc(100% - 15px) 0%, 
    100% 15px, 
    100% calc(100% - 15px), 
    calc(100% - 15px) 100%, 
    21px 100%, 
    0.8% 50%
  );
  padding: 0.75rem 1.15rem 0.75rem 1.8rem;
}

/* Outer Luminous Border Frame */
.naigc-holo-border {
  width: 100%;
  height: 100%;
  padding: 1.5px;
  box-sizing: border-box;
  transition: all 0.3s ease;
}

/* Inner Translucent Dark Glass Surface */
.naigc-holo-surface {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  background-color: rgba(4, 15, 34, 0.94);
  background-image: 
    radial-gradient(rgba(0, 240, 255, 0.12) 1px, transparent 1px),
    var(--naigc-panel-bg);
  background-size: 14px 14px, 100% 100%;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 1rem;
  position: relative;
  overflow: hidden;
}

/* Top highlight hairline */
.naigc-holo-surface::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  pointer-events: none;
}

/* Holographic Laser Shimmer Sweep */
.naigc-holo-surface::after {
  content: "";
  position: absolute;
  top: 0;
  left: -140%;
  width: 65%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
  transform: skewX(-25deg);
  pointer-events: none;
}

.naigc-holo-card:hover .naigc-holo-surface::after {
  left: 180%;
  transition: left 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Micro Tech Accent Mark */
.naigc-card-tech-accent {
  position: absolute;
  top: 8px;
  right: 24px;
  width: 16px;
  height: 2px;
  opacity: 0.6;
}

.naigc-card-right .naigc-card-tech-accent {
  right: auto;
  left: 24px;
}

.naigc-cyan .naigc-card-tech-accent {
  background: var(--naigc-cyan-primary);
  box-shadow: 0 0 6px var(--naigc-cyan-primary);
}

.naigc-purple .naigc-card-tech-accent {
  background: var(--naigc-purple-primary);
  box-shadow: 0 0 6px var(--naigc-purple-primary);
}

/* ==========================================================================
   INTERACTIVE HOVER STATES

  transform: translateX(5px) translateY(-2px) scale(1.02);
}

  transform: translateX(-5px) translateY(-2px) scale(1.02);

.naigc-cyan:hover {

/* Icon Container: Faceted Chamfered Hexagon */
.naigc-icon-frame {
  width: 48px;
  height: 48px;
  min-width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.naigc-icon-frame svg {

  height: 24px;

/* ==========================================================================

.naigc-trace-line {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;

.naigc-trace-right {

.naigc-trace-node {

    <h1>MemoryQuest: arcade photo booth hire for your party</h1>
    <p>Interactive Holographic AI Experience Terminal: Neural Avatars, Generative Motion, Voice Synthesis & Turing Battles. Discover the possibilities of artificial intelligence, emerging technologies and ideas shaping tomorrow</p>

    <h2>Games</h2>
    <ul>
        <li><strong>Photo</strong>: with backgrounds, effects and frames.</li>
        <li><strong>Video</strong>: short clips, with effects too.</li>
        <li><strong>Audio</strong>: record a wish or a message.</li>
        <li><strong>Challenge</strong>: the machine hands out a dare, you decide beforehand which ones.</li>
        <li><strong>Boomerang</strong>: your clip forwards and backwards.</li>
        <li><strong>Cartoon</strong>: your photo in a drawing style.</li>
        <li><strong>Karaoke</strong>: sing along, recorded.</li>
        <li><strong>Quizbattle</strong>: your own questions, answered with A, B, C or D, with a leaderboard.</li>
    </ul>

    <h2>Your party, your style</h2>
    <p>In the configurator you give the machine your colours, logo, texts and images, and you choose which games, challenges, backgrounds and effects guests come across. Custom wraps for the outside of the machine are available on request.</p>

    <h2>Pricing</h2>
    <ul>
        <li><strong>Basic</strong>: €275 per day. Photo, video, boomerang, audio, challenges, backgrounds and classic effects. 3 backgrounds of your own (1 of them made with AI) and 1 frame of your own.</li>
        <li><strong>Plus</strong>: €375 per day. Everything in Basic, plus the Quizbattle with a leaderboard, AI cartoons of your guests (100 per party), AI backgrounds and styles made by guests (3 per guest), and more backgrounds, frames and cartoon styles of your own.</li>
        <li><strong>All-in</strong>: €475 per day. Everything in Plus, plus karaoke, unlimited cartoons, 5 AI backgrounds and styles per guest and the most backgrounds, frames and cartoon styles of your own.</li>
    </ul>
    <p>Setup is always included. <strong>Prices apply within 25 km of Hardenberg, the Netherlands.</strong> Beyond that, travel costs are on request.</p>

    <h2>Frequently asked questions</h2>
    <h3>Do guests need to install anything?</h3>
    <p>No. The QR code opens a mobile page where they enter their name and see their memories again.</p>
    <h3>Who gets to see the memories?</h3>
    <p>The host can look back at every memory of the event. Guests see their own collection.</p>
    <h3>How does the Quizbattle work?</h3>
    <p>The Quizbattle is a quiz with your own questions, played on the arcade machine’s buttons. You write the questions in the configurator and set the time for each one. Guests who signed in with the QR code play once and answer with A, B, C or D. Whoever gets the most right, and fastest, tops the leaderboard. Included in Plus and All-in.</p>
    <h3>What happens after booking?</h3>
    <p>After payment you get a link to finish setting up your event in the configurator. Setup on the day is included.</p>
    <h3>Do you travel further?</h3>
    <p>Yes. Prices apply within 25 km of Hardenberg. Beyond that, travel costs are on request.</p>

    <p>Turn on JavaScript to check availability and book straight away.</p>

    <p>Design and development by <a href="https://www.build2connect.nl/" style="color:inherit">Build2Connect</a></p>
