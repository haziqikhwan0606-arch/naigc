 :root {
  --mq4-bg: #020617;
  --mq4-ink: #f0f9ff;
  --mq4-muted: rgba(224, 242, 254, 0.78);
  --mq4-faint: rgba(224, 242, 254, 0.58);
  --mq4-heading: #e0f2fe;
  --mq4-glow: rgba(0, 225, 255, 0.75);
  --mq4-rose: #bae6fd;
  --mq4-caption: #7dd3fc;
  --mq4-pink: #00e5ff;
  --mq4-pink-deep: #0284c7;
  --mq4-hot: #38bdf8;
  --mq4-cyan: #00e5ff;
  --mq4-cyan-deep: #0284c7;
  --mq4-ice: #e0f2fe;
  --mq4-amber: #f59e0b;
  --mq4-amber-deep: #d97706;
  --mq4-honey: #fef08a;
  --mq4-line: rgba(56, 189, 248, 0.22);
  --mq4-line-soft: rgba(56, 189, 248, 0.12);
  --mq4-line-strong: rgba(56, 189, 248, 0.55);
  --mq4-fill: rgba(56, 189, 248, 0.04);
  --mq4-fill-hover: rgba(56, 189, 248, 0.16);

  --mq4-font: "Space Grotesk", "Saira", system-ui, -apple-system, sans-serif;
  --mq4-font-pixel: "Orbitron", "Space Grotesk", monospace, sans-serif;

  --mq4-fs-small: 0.82rem;
  --mq4-fs-kicker: 0.95rem;
  --mq4-fs-body: 1.05rem;
  --mq4-fs-lead: clamp(1.05rem, 0.9rem + 0.45vw, 1.35rem);
  --mq4-fs-title: clamp(2.5rem, 1.6rem + 3vw, 4rem);
  --mq4-glow-text:
    0 0 1px rgba(255, 255, 255, 0.9),
    0 0 8px var(--mq4-glow),
    0 0 20px rgba(0, 225, 255, 0.35);

  --mq4-r-sm: 4px;
  --mq4-r-md: 8px;
  --mq4-r-lg: 18px;
  --mq4-r-xl: 22px;
  /* Buttons, fields, cards and panels in the page sections. */
  --mq4-r-ui: 12px;

  --mq4-gutter: clamp(1.25rem, 6vw, 6rem);
  /* Story copy sits in a centred stage of at most 2:1, so on ultra-wide screens it stays near the cabinet. */
  --mq4-stage: min(100vw, 200vh);
  --mq4-edge: max(calc((100vw - var(--mq4-stage)) / 2 + var(--mq4-stage) * 0.06), var(--mq4-safe-left));
  --mq4-edge-r: max(calc((100vw - var(--mq4-stage)) / 2 + 1.5rem), var(--mq4-safe-right));
  --mq4-max: 76rem;
  --mq4-section: clamp(3.5rem, 2.5rem + 4vw, 6.5rem);

  --mq4-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mq4-ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --mq4-ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);

  --mq4-safe-top: env(safe-area-inset-top, 0px);
  --mq4-safe-right: env(safe-area-inset-right, 0px);
  --mq4-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mq4-safe-left: env(safe-area-inset-left, 0px);
}

html,
body {
  margin: 0;
  background: var(--mq4-bg);
  color: var(--mq4-ink);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* Loader: NAIGC Cyber-Prestige Brand Loader (Electric Cyan & Champagne Gold) */
.mq4-loader {
  --p: 0;
  --q: 0;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background:
    radial-gradient(50vw 35vh at 50% 50%, rgba(0, 217, 255, 0.15) 0%, rgba(229, 184, 105, 0.05) 50%, transparent 75%),
    linear-gradient(180deg, #020917 0%, #031430 50%, #010612 100%);
  font-family: var(--mq4-font-pixel);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.mq4-loader.is-open {
  opacity: 0;
  visibility: hidden;
}

.mq4-loader__box {
  display: grid;
  gap: 0.95rem;
  width: min(20rem, 74vw);
}

.mq4-loader__label,
.mq4-loader__pct {
  display: flex;
  justify-content: flex-start;
  margin: 0;
  color: #E2E8F0;
  font-size: 0.76rem;
  line-height: 1;
  letter-spacing: 0.14em;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(0, 217, 255, 0.7);
}

.mq4-loader__label span {
  color: #00D9FF;
}

.mq4-loader__label::after {
  content: "";
  width: 0.62em;
  height: 1em;
  margin-left: 0.4em;
  background: #00D9FF;
  box-shadow: 0 0 10px #00D9FF, 0 0 18px #00D9FF;
  animation: mq4-loader-blink 1s steps(1, end) infinite;
}

.mq4-loader__pct {
  justify-content: flex-end;
  color: #E5B869;
  text-shadow: 0 0 10px rgba(229, 184, 105, 0.65);
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}

/* NAIGC Cyber-Prestige Neon Bar */
.mq4-loader__bar {
  position: relative;
  height: 1.35rem;
  padding: 3px;
  border: 1px solid rgba(0, 217, 255, 0.75);
  border-radius: 4px;
  background: rgba(2, 11, 28, 0.94);
  box-shadow:
    0 0 18px rgba(0, 217, 255, 0.35),
    0 0 32px rgba(0, 217, 255, 0.15),
    inset 0 0 10px rgba(0, 10, 30, 0.85);
}

/* 20 blocks running from Electric Cyan to Champagne Gold */
.mq4-loader__fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #00D9FF 0%, #0090F0 40%, #E5B869 80%, #F6D365 100%);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
  filter: drop-shadow(0 0 8px rgba(0, 217, 255, 0.85)) drop-shadow(0 0 14px rgba(229, 184, 105, 0.5));
  clip-path: inset(0 calc(100% - var(--q) * 100%) 0 0);
}

.mq4-loader__error {
  margin: 0;
  color: #F87171;
  font-family: var(--mq4-font);
  font-size: var(--mq4-fs-body);
  line-height: 1.45;
  text-align: center;
}

@keyframes mq4-loader-blink {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mq4-loader,
  .mq4-loader.is-open {
    transition: none;
  }

  .mq4-loader__label::after {
    animation: none;
  }
}

/* NAIGC — 8 PILLARS REDESIGN: ULTRA-FUTURISTIC HOLOGRAPHIC HUD INTERFACE */

:root {
  --naigc-cyan-primary: #00F0FF;
  --naigc-cyan-secondary: #0077FE;
  --naigc-cyan-glow: rgba(0, 240, 255, 0.40);
  --naigc-cyan-glow-strong: rgba(0, 240, 255, 0.75);

  --naigc-purple-primary: #C084FC;
  --naigc-purple-secondary: #9333EA;
  --naigc-purple-glow: rgba(192, 132, 252, 0.40);
  --naigc-purple-glow-strong: rgba(192, 132, 252, 0.75);

  --naigc-panel-bg: linear-gradient(135deg, rgba(6, 21, 45, 0.94) 0%, rgba(3, 11, 26, 0.98) 100%);
}

/* Hardware-Accelerated Malaysian Skyline Background (GPU Composited Layer - Zero Scroll Lag) */

    url('./build/assets/kl_skyline_day.jpg') no-repeat center center / cover !important;

}

body.mq4-body,
#mq-landing-v4,
.mq4,

.mq4-story,

/* 3D Mascot Stage layer (positioned strictly IN FRONT OF dark atmosphere) */
.mq4-stage {

}

/* Hide BEYOND HUMAN text and default buttons */

/* Intro Layout */
.mq4-intro {

/* Title at top center (STRICTLY LOCKED) */

  opacity: 0 !important;

.mq4-intro__body {

  justify-content: center !important;

  margin: 0 !important;

:root {
  /* NAIGC Official Holographic Palette */
  --naigc-cyan: #00D9FF;
  --naigc-cyan-dim: rgba(0, 217, 255, 0.45);
  --naigc-cyan-glow: rgba(0, 217, 255, 0.32);
  --naigc-cyan-bloom: rgba(0, 217, 255, 0.75);

  --naigc-blue-deep: #063B78;
  --naigc-navy-midnight: #020B20;
  
  --naigc-gold: #E5B869; --naigc-violet: #E5B869;
  --naigc-gold-dim: rgba(229, 184, 105, 0.45); --naigc-violet-dim: rgba(229, 184, 105, 0.45);
  --naigc-gold-glow: rgba(229, 184, 105, 0.35); --naigc-violet-glow: rgba(229, 184, 105, 0.35);
  --naigc-gold-bloom: rgba(229, 184, 105, 0.75); --naigc-violet-bloom: rgba(229, 184, 105, 0.75);

  --naigc-ice-blue: #C9F5FF;
  --naigc-white: #FFFFFF;
  --naigc-desc: #A5BDCF;

  /* Layered Surface */
  --naigc-surface-bg: linear-gradient(135deg, rgba(8, 24, 62, 0.95) 0%, rgba(4, 12, 34, 0.98) 100%);
}

/* Atmospheric Depth Glow Behind Central Mascot */
.mq4-intro::before {
  content: "";
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 640px;
  height: 640px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 217, 255, 0.16) 0%, rgba(6, 28, 68, 0.24) 40%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}

/* Full-Screen Cybernetic Atmospheric Dark Backdrop (Behind 3D mascot & 8 pillars, in front of daytime skyline) */
#naigc-stage-atmosphere,
.naigc-stage-atmosphere {
  position: fixed !important;
  inset: 0 !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  margin: 0 !important;
  padding: 0 !important;
  pointer-events: none !important;
  z-index: 2 !important;
  opacity: 0;
  transition: opacity 0.5s ease-out;
  background: radial-gradient(circle at 50% 50%, rgba(4, 15, 34, 0.78) 0%, rgba(2, 6, 23, 0.86) 55%, rgba(1, 4, 16, 0.94) 100%) !important;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  will-change: opacity;
}
#naigc-stage-atmosphere.is-active,
.naigc-stage-atmosphere.is-active {
  opacity: 1 !important;
}

/* 8 Pillars Overall Grid Container */
.naigc-pillars-container {
  display: grid;
  grid-template-columns: minmax(380px, 490px) minmax(240px, 1fr) minmax(380px, 490px);
  width: 100%;
  max-width: 1640px;
  height: calc(100vh - 100px);
  max-height: 870px;
  margin: 0 auto;
  align-items: center;
  box-sizing: border-box;
  padding: 0 1.5rem;
  z-index: 12;
  position: relative;
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  /* Hidden strictly until scroll enters 8-pillars ecosystem stage */
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* Activated strictly when scroll reaches stage (>= 4250px) */
.naigc-pillars-container.is-stage-active {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
}

/* Visor Outward Holographic Shockwave / Matrix Burst (Lightweight GPU Pulse) */
.naigc-visor-shockwave {
  position: absolute;
  top: 36%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.1);
  width: 260px;
  height: 260px;
  border-radius: 50%;
  border: 2px solid #00F0FF;
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.75), inset 0 0 15px rgba(0, 240, 255, 0.5);
  pointer-events: none;
  z-index: 18;
  opacity: 0;
}

.is-stage-active .naigc-visor-shockwave {
  animation: naigc-shockwave-pulse 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
}

@keyframes naigc-shockwave-pulse {
  0% {
    transform: translate(-50%, -50%) scale(0.1);
    opacity: 1;
  }
  50% {
    opacity: 0.9;
  }
  100% {
    transform: translate(-50%, -50%) scale(7.5);
    opacity: 0;
  }
}

/* Concentric Radar Grid Expansion */
.naigc-visor-hex-grid {
  position: absolute;
  top: 36%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.15);
  width: 340px;
  height: 340px;
  border-radius: 50%;
  border: 1.5px dashed #FFB800;
  box-shadow: 0 0 20px rgba(255, 184, 0, 0.5);
  pointer-events: none;
  z-index: 17;
  opacity: 0;
}

.is-stage-active .naigc-visor-hex-grid {
  animation: naigc-radar-expand 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
}

@keyframes naigc-radar-expand {
  0% {
    transform: translate(-50%, -50%) scale(0.15) rotate(0deg);
    opacity: 1;
  }
  60% {
    opacity: 0.8;
  }
  100% {
    transform: translate(-50%, -50%) scale(5.8) rotate(110deg);
    opacity: 0;
  }
}

/* Left & Right Columns */
.naigc-pillars-col {
  display: flex;
  flex-direction: column;
  gap: clamp(1.4rem, 3.2vh, 2.25rem);
  pointer-events: auto;
  z-index: 20;
}

/* Central Mascot Column with Quantum Holographic Emitter Pad Base */
.naigc-pillars-center {
  min-width: 220px;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
  height: 100%;
}

.naigc-quantum-pad {
  position: absolute;
  bottom: -135px;
  left: 50%;
  transform: translateX(-50%);
  width: 380px;
  height: 200px;
  pointer-events: none;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.is-stage-active .naigc-quantum-pad {
  opacity: 1;
  animation: naigc-dais-boot 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
}

@keyframes naigc-dais-boot {
  0% {
    transform: translateX(-50%) scale(0.2);
    opacity: 0;
    filter: brightness(2.8);
  }
  60% {
    transform: translateX(-50%) scale(1.08);
    opacity: 1;
    filter: brightness(1.6);
  }
  100% {
    transform: translateX(-50%) scale(1);
    opacity: 1;
    filter: brightness(1);
  }
}
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 3D Perspective Disc Stage Grounded Directly Under Soles */
.naigc-quantum-pad * {
  animation-play-state: paused;
}
.is-stage-active .naigc-quantum-pad * {
  animation-play-state: running;
}

.naigc-pad-disc-stage {
  position: absolute;
  bottom: 0px;
  width: 340px;
  height: 340px;
  transform: perspective(650px) rotateX(76deg);
  transform-style: preserve-3d;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Outer dashed spinning ring */
.naigc-ring-outer-dashed {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px dashed rgba(0, 217, 255, 0.7);
  box-shadow: 0 0 25px rgba(0, 217, 255, 0.45), inset 0 0 20px rgba(0, 217, 255, 0.25);
  animation: naigc-pad-spin-cw 22s linear infinite;
}

/* Segmented ticks ring */
.naigc-ring-cyber-ticks {
  position: absolute;
  inset: 22px;
  border-radius: 50%;
  border: 1.5px dotted rgba(255, 255, 255, 0.6);
  animation: naigc-pad-spin-ccw 16s linear infinite;
}

/* Gold middle ring */
.naigc-ring-hex-gold {
  position: absolute;
  inset: 48px;
  border-radius: 50%;
  border: 2px solid rgba(229, 184, 105, 0.75);
  box-shadow: 0 0 20px rgba(229, 184, 105, 0.45);
  animation: naigc-pad-spin-cw 12s linear infinite;
}

/* Inner cyan ring */
.naigc-ring-inner-cyan {
  position: absolute;
  inset: 76px;
  border-radius: 50%;
  border: 2px solid rgba(0, 217, 255, 0.85);
  background: radial-gradient(circle, rgba(0, 217, 255, 0.35) 0%, rgba(0, 217, 255, 0.1) 60%, transparent 80%);
  box-shadow: 0 0 30px rgba(0, 217, 255, 0.65), inset 0 0 15px rgba(0, 217, 255, 0.5);
  animation: naigc-pad-pulse 2.8s ease-in-out infinite alternate;
}

/* Center core emitter */
.naigc-pad-core-glow {
  position: absolute;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, rgba(0, 217, 255, 0.95) 45%, rgba(0, 217, 255, 0) 75%);
  box-shadow: 0 0 35px #00D9FF, 0 0 60px rgba(0, 217, 255, 0.85);
}

/* Orbital node lights on pad */
.naigc-pad-nodes {
  position: absolute;
  inset: 0;
  animation: naigc-pad-spin-cw 8s linear infinite;
}
.naigc-pad-node {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px #00D9FF, 0 0 18px #00D9FF;
}
.naigc-pad-node.n1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.naigc-pad-node.n2 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.naigc-pad-node.n3 { left: 0; top: 50%; transform: translate(-50%, -50%); background: #F6D365; box-shadow: 0 0 10px #F6D365; }
.naigc-pad-node.n4 { right: 0; top: 50%; transform: translate(50%, -50%); background: #F6D365; box-shadow: 0 0 10px #F6D365; }

.naigc-pad-light-shaft {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 240px;
  background: linear-gradient(to top, rgba(255, 255, 255, 0.8) 0%, rgba(0, 217, 255, 0.45) 50%, transparent 100%);
  opacity: 0.8;
}

.naigc-pad-readout {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.52rem;
  letter-spacing: 0.18em;
  color: rgba(0, 217, 255, 0.85);
  white-space: nowrap;
  text-shadow: 0 0 8px rgba(0, 217, 255, 0.7);
  pointer-events: none;
}

@keyframes naigc-pad-spin-cw {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes naigc-pad-spin-ccw {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}
@keyframes naigc-pad-pulse {
  from { transform: scale(0.97); opacity: 0.75; }
  to { transform: scale(1.03); opacity: 1; }
}
@keyframes naigc-beam-shimmer {
  from { opacity: 0.6; transform: translateX(-50%) scaleX(0.95); }
  to { opacity: 0.95; transform: translateX(-50%) scaleX(1.05); }
}
@keyframes naigc-mote-rise {
  0% { bottom: 0; opacity: 0; transform: translateY(0) scale(0.5); }
  25% { opacity: 1; transform: translateY(-30px) scale(1); }
  85% { opacity: 0.8; }
  100% { bottom: 100%; opacity: 0; transform: translateY(-140px) scale(0.2); }
}

/* ==========================================================================
   LAYER 1 & 2: ANGULAR HOLOGRAPHIC PROJECTION SHELL (STAGGERED 3D FLY-IN)
   ========================================================================== */

.naigc-holo-projection {
  position: relative;
  display: flex;
  align-items: center;
  text-decoration: none;
  box-sizing: border-box;
  width: 100%;
  max-width: 485px;
  height: 104px;
  cursor: pointer;
  opacity: 0;
  z-index: 22;
  will-change: transform, opacity, filter;
  transition: filter 0.35s ease, box-shadow 0.35s ease;
}

/* Spatial 3D Command-Centre Perspective Suspended in Space */
.naigc-proj-left {
  transform: perspective(1000px) rotateY(6deg) rotateX(1deg);
  transform-origin: right center;
}

.naigc-proj-right {
  transform: perspective(1000px) rotateY(-6deg) rotateX(1deg);
  transform-origin: left center;
}

/* Staggered Spatial Depths (Final Resting Coordinates) */
.naigc-pillars-col a:nth-child(1) { --naigc-tz: -6px; }
.naigc-pillars-col a:nth-child(2) { --naigc-tz: 10px; }
.naigc-pillars-col a:nth-child(3) { --naigc-tz: 14px; }
.naigc-pillars-col a:nth-child(4) { --naigc-tz: -2px; }

.naigc-pillars-right a:nth-child(1) { --naigc-tz: -6px; }
.naigc-pillars-right a:nth-child(2) { --naigc-tz: 10px; }
.naigc-pillars-right a:nth-child(3) { --naigc-tz: 14px; }
.naigc-pillars-right a:nth-child(4) { --naigc-tz: -2px; }

/* 3D Staggered Holographic Fly-In Animation Keyframes (100% GPU Hardware Composited - No Blur) */
@keyframes naigc-fly-in-left {
  0% {
    opacity: 0;
    transform: perspective(1000px) rotateY(-24deg) rotateX(2deg) translateX(-80px) scale(0.9);
    filter: brightness(2);
  }
  65% {
    opacity: 0.95;
    transform: perspective(1000px) rotateY(8deg) rotateX(1deg) translateX(8px) translateZ(var(--naigc-tz, 0px)) scale(1.01);
    filter: brightness(1.2);
  }
  100% {
    opacity: 1;
    transform: perspective(1000px) rotateY(6deg) rotateX(1deg) translateX(0) translateZ(var(--naigc-tz, 0px)) scale(1);
    filter: brightness(1);
  }
}

@keyframes naigc-fly-in-right {
  0% {
    opacity: 0;
    transform: perspective(1000px) rotateY(24deg) rotateX(2deg) translateX(80px) scale(0.9);
    filter: brightness(2);
  }
  65% {
    opacity: 0.95;
    transform: perspective(1000px) rotateY(-8deg) rotateX(1deg) translateX(-8px) translateZ(var(--naigc-tz, 0px)) scale(1.01);
    filter: brightness(1.2);
  }
  100% {
    opacity: 1;
    transform: perspective(1000px) rotateY(-6deg) rotateX(1deg) translateX(0) translateZ(var(--naigc-tz, 0px)) scale(1);
    filter: brightness(1);
  }
}

/* Staggered Deployments Triggered on Stage Activation */
.is-stage-active .naigc-pillars-left a[data-pillar="1"] {
  animation: naigc-fly-in-left 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
}
.is-stage-active .naigc-pillars-left a[data-pillar="2"] {
  animation: naigc-fly-in-left 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
}
.is-stage-active .naigc-pillars-left a[data-pillar="3"] {
  animation: naigc-fly-in-left 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.27s forwards;
}
.is-stage-active .naigc-pillars-left a[data-pillar="4"] {
  animation: naigc-fly-in-left 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
}

.is-stage-active .naigc-pillars-right a[data-pillar="5"] {
  animation: naigc-fly-in-right 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.08s forwards;
}
.is-stage-active .naigc-pillars-right a[data-pillar="6"] {
  animation: naigc-fly-in-right 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.19s forwards;
}
.is-stage-active .naigc-pillars-right a[data-pillar="7"] {
  animation: naigc-fly-in-right 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.30s forwards;
}
.is-stage-active .naigc-pillars-right a[data-pillar="8"] {
  animation: naigc-fly-in-right 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.41s forwards;
}

/* Interactive Hover Response */
.naigc-holo-projection:hover {
  filter: brightness(1.2);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
  z-index: 25;
}
.naigc-proj-left:hover {
  transform: perspective(1000px) rotateY(2deg) translateX(12px) translateZ(24px) scale(1.025) !important;
}
.naigc-proj-right:hover {
  transform: perspective(1000px) rotateY(-2deg) translateX(-12px) translateZ(24px) scale(1.025) !important;
}

/* Floating Offset Secondary Frame */
.naigc-offset-frame {
  position: absolute;
  inset: -4px -6px;
  pointer-events: none;
  z-index: 2;
  transition: all 0.3s ease;
}

.naigc-tech-bracket {
  position: absolute;
  width: 9px;
  height: 9px;
  opacity: 0.75;
  transition: all 0.3s ease;
}

.naigc-theme-cyan .naigc-tech-bracket {
  border-color: var(--naigc-cyan);
}

.naigc-theme-gold .naigc-tech-bracket,
.naigc-theme-gold .naigc-tech-bracket {
  border-color: #E5B869;
}

.naigc-bracket-tl {
  top: 0;
  left: 0;
  border-top: 2px solid;
  border-left: 2px solid;
}

.naigc-bracket-bl {
  bottom: 0;
  left: 0;
  border-bottom: 2px solid;
  border-left: 2px solid;
}

.naigc-bracket-tr {
  top: 0;
  right: 0;
  border-top: 2px solid;
  border-right: 2px solid;
}

.naigc-bracket-br {
  bottom: 0;
  right: 0;
  border-bottom: 2px solid;
  border-right: 2px solid;
}

/* Micro-Interface Header Tag */
.naigc-tech-grid-tag {
  position: absolute;
  top: -11px;
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.55rem;
  letter-spacing: 0.14em;
  font-weight: 800;
  opacity: 1;
}

.naigc-proj-left .naigc-tech-grid-tag {
  left: 26px;
}

.naigc-proj-right .naigc-tech-grid-tag {
  right: 26px;
}

.naigc-theme-cyan .naigc-tech-grid-tag {
  color: #00F0FF;
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.85);
}

.naigc-theme-gold .naigc-tech-grid-tag {
  color: #FFB800;
  text-shadow: 0 0 8px rgba(255, 184, 0, 0.85);
}

/* ==========================================================================
   ANGULAR TRAPEZOIDAL / ASYMMETRIC POLYGON GEOMETRY
   ========================================================================== */

/* Outer Polygon Border Frame */
.naigc-poly-border {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 1.5px;
  position: relative;
  transition: all 0.3s ease;
}

.naigc-theme-cyan .naigc-poly-border {
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.75) 0%, rgba(0, 140, 255, 0.35) 50%, rgba(0, 240, 255, 0.75) 100%);
  box-shadow: 0 0 18px rgba(0, 240, 255, 0.28);
}

.naigc-theme-gold .naigc-poly-border {
  background: linear-gradient(135deg, rgba(255, 184, 0, 0.75) 0%, rgba(255, 130, 0, 0.35) 50%, rgba(255, 184, 0, 0.75) 100%);
  box-shadow: 0 0 18px rgba(255, 184, 0, 0.28);
}

/* Left Panels Polygon: Cut corners on left, Tapered apex facing Cyborg on right */
.naigc-proj-left .naigc-poly-border {
  clip-path: polygon(
    22px 0%, 
    calc(100% - 28px) 0%, 
    100% 50%, 
    calc(100% - 28px) 100%, 
    22px 100%, 
    0% calc(100% - 22px), 
    0% 22px
  );
}

.naigc-proj-left .naigc-poly-surface {
  clip-path: polygon(
    21px 0%, 
    calc(100% - 27px) 0%, 
    99.2% 50%, 
    calc(100% - 27px) 100%, 
    21px 100%, 
    0% calc(100% - 21px), 
    0% 21px
  );
  padding: 0.75rem 2.4rem 0.75rem 1.15rem;
}

/* Right Panels Polygon: Cut corners on right, Tapered apex facing Cyborg on left */
.naigc-proj-right .naigc-poly-border {
  clip-path: polygon(
    28px 0%, 
    calc(100% - 22px) 0%, 
    100% 22px, 
    100% calc(100% - 22px), 
    calc(100% - 22px) 100%, 
    28px 100%, 
    0% 50%
  );
}

.naigc-proj-right .naigc-poly-surface {
  clip-path: polygon(
    27px 0%, 
    calc(100% - 21px) 0%, 
    100% 21px, 
    100% calc(100% - 21px), 
    calc(100% - 21px) 100%, 
    27px 100%, 
    0.8% 50%
  );
  padding: 0.75rem 1.15rem 0.75rem 2.4rem;
}

/* Base Poly Surface (Shared Smoked Sapphire Glass) */
.naigc-poly-surface {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  background: var(--naigc-surface-bg);
  display: flex;
  align-items: center;
  gap: 0.85rem;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.22), 
              inset 0 -1px 2px rgba(0, 0, 0, 0.5),
              0 14px 40px rgba(0, 10, 32, 0.45);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Specular Glare & Glass Sweep Refraction */
.naigc-poly-surface::after {
  content: "";
  position: absolute;
  top: -60%;
  left: -60%;
  width: 220%;
  height: 220%;
  background: linear-gradient(
    115deg,
    transparent 42%,
    rgba(255, 255, 255, 0.03) 46%,
    rgba(255, 255, 255, 0.22) 50%,
    rgba(0, 217, 255, 0.12) 54%,
    transparent 58%
  );
  transform: translateX(-100%);
  pointer-events: none;
  z-index: 4;
  transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
}

.naigc-holo-projection:hover .naigc-poly-surface::after {
  transform: translateX(100%);
}

/* Internal Micro-Grid & Holographic Texture */
.naigc-poly-grid {
  position: absolute;
  inset: 0;
  background-image: 
    repeating-linear-gradient(0deg, rgba(0, 217, 255, 0.045) 0px, rgba(0, 217, 255, 0.045) 1px, transparent 1px, transparent 4px),
    linear-gradient(90deg, rgba(0, 217, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 4px, 16px 100%;
  pointer-events: none;
  z-index: 1;
}

/* Vertical Scanning Beam Animation */
.naigc-scan-beam {
  position: absolute;
  top: -40%;
  left: 0;
  right: 0;
  height: 16px;
  background: linear-gradient(180deg, transparent, rgba(0, 217, 255, 0.22), transparent);
  pointer-events: none;
  z-index: 2;
  animation: naigc-scan-anim 4.2s infinite ease-in-out;
}

.naigc-theme-gold .naigc-scan-beam,
.naigc-theme-gold .naigc-scan-beam {
  background: linear-gradient(180deg, transparent, rgba(229, 184, 105, 0.28), transparent);
}

@keyframes naigc-scan-anim {
  0% { top: -40%; }
  50% { top: 120%; }
  100% { top: 120%; }
}

/* ==========================================================================
   INTERNAL HOLOGRAPHIC COMPONENTS: BADGE, ICON, TEXT, ARROW
   ========================================================================== */

/* Pillar Number Badge */
.naigc-badge-capsule {
  position: absolute;
  top: 7px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  border-radius: 2px;
  z-index: 5;
}

.naigc-proj-left .naigc-badge-capsule {
  left: 14px;
}

.naigc-proj-right .naigc-badge-capsule {
  right: 14px;
}

.naigc-theme-cyan .naigc-badge-capsule {
  background: rgba(0, 240, 255, 0.28);
  border: 1.5px solid #00F0FF;
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
  color: #00F0FF;
}

.naigc-theme-gold .naigc-badge-capsule {
  background: rgba(255, 184, 0, 0.28);
  border: 1.5px solid #FFB800;
  box-shadow: 0 0 10px rgba(255, 184, 0, 0.45);

}

.naigc-badge-num {
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.70rem;

  line-height: 1.2;
}

.naigc-badge-dot {

  box-shadow: 0 0 6px currentColor;
}

/* Faceted Hexagonal Icon Chamber */
.naigc-icon-chamber {
  width: 52px;
  height: 52px;
  min-width: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  position: relative;
  z-index: 5;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

.naigc-theme-cyan .naigc-icon-chamber {
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.32) 0%, rgba(4, 16, 44, 0.96) 100%);
  border: 1.5px solid #00F0FF;
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 0 16px rgba(0, 240, 255, 0.4);
  color: #00F0FF;
}

.naigc-theme-gold .naigc-icon-chamber {
  background: linear-gradient(135deg, rgba(255, 184, 0, 0.32) 0%, rgba(24, 14, 2, 0.96) 100%);
  border: 1.5px solid #FFB800;
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 0 16px rgba(255, 184, 0, 0.4);
  color: #FFB800;
}

.naigc-icon-chamber svg {
  width: 25px;
  height: 25px;
  filter: drop-shadow(0 0 8px currentColor);
}

/* Typography Body */
.naigc-poly-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.25rem;
  flex: 1;
  min-width: 0;
  z-index: 5;

.naigc-poly-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: #FFFFFF !important;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: visible;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 240, 255, 0.45);
  transition: color 0.25s ease;
}

.naigc-theme-gold .naigc-poly-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: #FFFFFF !important;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: visible;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(255, 184, 0, 0.45);
  transition: color 0.25s ease;
}

.naigc-poly-desc {
  margin: 0;
  color: #E2E8F0 !important;
  font-size: 0.74rem;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;

  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);

/* Micro-Telemetry Status Line */
.naigc-poly-meta {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.54rem;
  font-weight: 700;
  letter-spacing: 0.10em;
  margin-top: 3px;

}

.naigc-meta-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #00F0FF;
  font-weight: 800;

.naigc-theme-gold .naigc-meta-status {

}

.naigc-meta-pip {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
  animation: naigc-meta-pulse 1.8s infinite ease-in-out;
}

@keyframes naigc-meta-pulse {
  0%, 100% { opacity: 0.4; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}

.naigc-meta-speed {

}

.naigc-meta-link {

}
.naigc-theme-gold .naigc-meta-link {

/* Subtle Directional Arrow Readout */

.naigc-theme-gold .naigc-holo-readout,
.naigc-theme-gold .naigc-holo-readout {
  color: #E5B869;

/* ==========================================================================
   HOVER & INTERACTION (DIMENSIONAL SUSPENDED FLOAT)
   ========================================================================== */

}

  filter: drop-shadow(0 0 16px rgba(0, 217, 255, 0.65)) drop-shadow(0 0 32px rgba(0, 217, 255, 0.35));
}

.naigc-theme-gold:hover .naigc-poly-border,
.naigc-theme-gold:hover .naigc-poly-border {
  background: linear-gradient(135deg, #E5B869 0%, #F6D365 50%, #D49A3D 100%);
  filter: drop-shadow(0 0 16px rgba(229, 184, 105, 0.65)) drop-shadow(0 0 32px rgba(229, 184, 105, 0.35));
}

.naigc-holo-projection:hover .naigc-poly-surface {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.42) 0%, rgba(240, 250, 255, 0.26) 50%, rgba(215, 240, 255, 0.18) 100%);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9),

.naigc-holo-projection:hover .naigc-icon-chamber {

.naigc-theme-cyan:hover .naigc-icon-chamber {

    <h1>MemoryQuest: arcade photo booth hire for your party</h1>
    <p>Interactive Holographic AI Experience Terminal: Neural Avatars, Generative Motion, Voice Synthesis & Turing Battles. Discover the possibilities of artificial intelligence, emerging technologies and ideas shaping tomorrow</p>

    <h2>Games</h2>
    <ul>
        <li><strong>Photo</strong>: with backgrounds, effects and frames.</li>
        <li><strong>Video</strong>: short clips, with effects too.</li>
        <li><strong>Audio</strong>: record a wish or a message.</li>
        <li><strong>Challenge</strong>: the machine hands out a dare, you decide beforehand which ones.</li>
        <li><strong>Boomerang</strong>: your clip forwards and backwards.</li>
        <li><strong>Cartoon</strong>: your photo in a drawing style.</li>
        <li><strong>Karaoke</strong>: sing along, recorded.</li>
        <li><strong>Quizbattle</strong>: your own questions, answered with A, B, C or D, with a leaderboard.</li>
    </ul>

    <h2>Your party, your style</h2>
    <p>In the configurator you give the machine your colours, logo, texts and images, and you choose which games, challenges, backgrounds and effects guests come across. Custom wraps for the outside of the machine are available on request.</p>

    <h2>Pricing</h2>
    <ul>
        <li><strong>Basic</strong>: €275 per day. Photo, video, boomerang, audio, challenges, backgrounds and classic effects. 3 backgrounds of your own (1 of them made with AI) and 1 frame of your own.</li>
        <li><strong>Plus</strong>: €375 per day. Everything in Basic, plus the Quizbattle with a leaderboard, AI cartoons of your guests (100 per party), AI backgrounds and styles made by guests (3 per guest), and more backgrounds, frames and cartoon styles of your own.</li>
        <li><strong>All-in</strong>: €475 per day. Everything in Plus, plus karaoke, unlimited cartoons, 5 AI backgrounds and styles per guest and the most backgrounds, frames and cartoon styles of your own.</li>
    </ul>
    <p>Setup is always included. <strong>Prices apply within 25 km of Hardenberg, the Netherlands.</strong> Beyond that, travel costs are on request.</p>

    <h2>Frequently asked questions</h2>
    <h3>Do guests need to install anything?</h3>
    <p>No. The QR code opens a mobile page where they enter their name and see their memories again.</p>
    <h3>Who gets to see the memories?</h3>
    <p>The host can look back at every memory of the event. Guests see their own collection.</p>
    <h3>How does the Quizbattle work?</h3>
    <p>The Quizbattle is a quiz with your own questions, played on the arcade machine’s buttons. You write the questions in the configurator and set the time for each one. Guests who signed in with the QR code play once and answer with A, B, C or D. Whoever gets the most right, and fastest, tops the leaderboard. Included in Plus and All-in.</p>
    <h3>What happens after booking?</h3>
    <p>After payment you get a link to finish setting up your event in the configurator. Setup on the day is included.</p>
    <h3>Do you travel further?</h3>
    <p>Yes. Prices apply within 25 km of Hardenberg. Beyond that, travel costs are on request.</p>

  let cachedPillars = null;
  let cachedAtmo = null;
  let stageWasActive = false;
  let scrollTicking = false;

  function ensureLayers() {
    if (!document.getElementById('naigc-skyline-bg')) {
      const bg = document.createElement('div');
      bg.id = 'naigc-skyline-bg';
      bg.setAttribute('aria-hidden', 'true');
      document.body.prepend(bg);
    }
    let atmo = document.getElementById('naigc-stage-atmosphere');
    if (!atmo) {
      atmo = document.createElement('div');
      atmo.id = 'naigc-stage-atmosphere';
      atmo.className = 'naigc-stage-atmosphere';
      atmo.setAttribute('aria-hidden', 'true');
      document.body.appendChild(atmo);
    }
    cachedAtmo = atmo;
    return atmo;
  }

  function updateStage() {
    scrollTicking = false;
    if (!cachedPillars) cachedPillars = document.getElementById('naigc-pillars');
    if (!cachedAtmo) cachedAtmo = document.getElementById('naigc-stage-atmosphere');
    if (!cachedPillars || !cachedAtmo) return;

    const isStage = window.scrollY >= 4250;
    if (isStage !== stageWasActive) {
      stageWasActive = isStage;
      if (isStage) {
        cachedPillars.classList.add('is-stage-active');
        cachedAtmo.classList.add('is-active');
      } else {
        cachedPillars.classList.remove('is-stage-active');
        cachedAtmo.classList.remove('is-active');
      }
    }
  }

  let ecoObserver = null;
  function mountEcosystem() {
    ensureLayers();
    const introBody = document.querySelector('.mq4-intro__body');
    if (introBody && !document.getElementById('naigc-pillars')) {
      introBody.innerHTML = pillarsMarkup;
      cachedPillars = document.getElementById('naigc-pillars');
      updateStage();
    }
  }

  function checkStageScroll() {
    if (!document.getElementById('naigc-pillars')) {
      mountEcosystem();
    }
    if (!scrollTicking) {
      scrollTicking = true;
      requestAnimationFrame(updateStage);
    }
  }

  ensureLayers();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountEcosystem);
  } else {
    mountEcosystem();
  }

  window.addEventListener('scroll', checkStageScroll, { passive: true });
  window.addEventListener('resize', checkStageScroll, { passive: true });

  // Lightweight observer scoped strictly to intro container to avoid Three.js subtree thrashing
  ecoObserver = new MutationObserver(() => {
    if (!document.getElementById('naigc-pillars')) {
      mountEcosystem();
    }
  });
  const introEl = document.querySelector('.mq4-intro') || document.body;
  ecoObserver.observe(introEl, { childList: true, subtree: true });

  // --- ULTRA-SMOOTH HARDWARE-ACCELERATED TRANSITION TO PILLARS (120 FPS) ---
  // Pillars 1-4 fly in from LEFT, Pillars 5-8 fly in from RIGHT
  const prefetchCache = new Set();
  function prefetchUrl(url) {
    if (!url || prefetchCache.has(url)) return;
    prefetchCache.add(url);
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  }

  // Pre-fetch pillar URLs on hover for instant navigation
  document.querySelectorAll('.naigc-holo-projection').forEach(link => {
    link.addEventListener('mouseenter', () => {
      const href = link.getAttribute('href');
      if (href) prefetchUrl(href);
    }, { passive: true });

    link.addEventListener('click', (e) => {
      const href = link.getAttribute('href');
      if (!href) return;
      e.preventDefault();

      const pillarNum = parseInt(link.dataset.pillar, 10);
      const isLeft = pillarNum >= 1 && pillarNum <= 4;

      // Add high-tech departure animation
      document.body.classList.add(isLeft ? 'naigc-departing-left' : 'naigc-departing-right');
      link.classList.add('is-departing-target');

      setTimeout(() => {
        window.location.href = href;
      }, 190);
    });
  });
})();
</script>
