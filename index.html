 /* ==========================================================================
   NAIGC — UNIFIED 8 PILLARS COMPONENT ARCHITECTURE
   Consistent geometry, dark translucent glassmorphic surfaces, crisp contrast
   ========================================================================== */

:root {
  /* NAIGC Official Holographic Palette */
  --naigc-cyan: #00D9FF;
  --naigc-cyan-dim: rgba(0, 217, 255, 0.4);
  --naigc-cyan-glow: rgba(0, 217, 255, 0.25);
  --naigc-cyan-border: linear-gradient(135deg, rgba(0, 217, 255, 0.9) 0%, rgba(14, 116, 204, 0.5) 50%, rgba(0, 217, 255, 0.85) 100%);

  --naigc-violet: #C084FC;
  --naigc-violet-dim: rgba(192, 132, 252, 0.4);
  --naigc-violet-glow: rgba(192, 132, 252, 0.25);
  --naigc-violet-border: linear-gradient(135deg, rgba(192, 132, 252, 0.9) 0%, rgba(147, 51, 234, 0.5) 50%, rgba(192, 132, 252, 0.85) 100%);

  --naigc-ice-blue: #C9F5FF;
  --naigc-white: #FFFFFF;
  --naigc-desc: #CBD5E1;

  /* High-Contrast Smoked Sapphire Glass Surface */
  --naigc-surface-bg: linear-gradient(135deg, rgba(8, 22, 54, 0.88) 0%, rgba(4, 12, 34, 0.94) 100%);
}

/* Malaysian Skyline Background on Stage (STRICTLY LOCKED) */
body.mq4-body,
.mq4-stage,
.mq4-story {
  background: 
    linear-gradient(180deg, rgba(14, 45, 90, 0.12) 0%, rgba(12, 38, 80, 0.04) 35%, rgba(8, 24, 56, 0.20) 75%, rgba(4, 14, 38, 0.60) 100%),
    url('./build/assets/kl_skyline_day.jpg') no-repeat center center / cover !important;
}

/* Hide BEYOND HUMAN text and default buttons */
.mq4-words {
  display: none !important;
}

.mq4-intro .mq4-lead,
.mq4-intro .mq4-intro__actions {
  display: none !important;
}

/* Intro Layout */
.mq4-intro {
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  inset: 0 !important;
  padding: 1.5rem 2rem !important;
  box-sizing: border-box !important;
  pointer-events: none !important;
  max-width: 100% !important;
  width: 100% !important;
}

/* Title at top center (STRICTLY LOCKED) */
.mq4-intro .mq4-title {
  margin: 0 auto !important;
  text-align: center !important;
  font-size: clamp(1.4rem, 1.2rem + 1.8vw, 2.4rem) !important;
  width: 100% !important;
  max-width: 32em !important;
  color: #ffffff !important;
  text-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 2px 4px rgba(0, 0, 0, 0.8) !important;
  letter-spacing: -0.01em !important;
  z-index: 10 !important;
  padding-top: 0.5rem !important;
}

.mq4-intro__body {
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  margin: 0 !important;
  position: relative !important;
}

/* ==========================================================================
   8 PILLARS CONTAINER & 4-LEFT 4-RIGHT SPATIAL ARRANGEMENT
   ========================================================================== */

.naigc-pillars-container {
  display: grid;
  grid-template-columns: minmax(360px, 420px) 1fr minmax(360px, 420px);
  width: 100%;
  max-width: 1540px;
  height: calc(100vh - 120px);
  max-height: 820px;
  margin: 0 auto;
  align-items: center;
  pointer-events: none;
  box-sizing: border-box;
  padding: 0 1.5rem;
  z-index: 12;
}

.naigc-pillars-col {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
  pointer-events: auto;
  z-index: 15;
  width: 100%;
}

.naigc-pillars-center {
  min-width: 180px;
  pointer-events: none;
}

/* ==========================================================================
   SHARED REUSABLE PILLAR COMPONENT (IDENTICAL STRUCTURE FOR ALL 8)
   ========================================================================== */

.naigc-pillar {
  position: relative;
  display: block;
  text-decoration: none;
  box-sizing: border-box;
  width: 100%;
  height: 86px;
  cursor: pointer;
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), filter 0.32s ease;
  will-change: transform;
}

/* Subtle 3D perspective oriented towards central cyborg */
.naigc-pillar-left {
  transform: perspective(1000px) rotateY(6deg);
  transform-origin: right center;
}

.naigc-pillar-right {
  transform: perspective(1000px) rotateY(-6deg);
  transform-origin: left center;
}

/* Suspended spatial depth staggering */
.naigc-pillars-left .naigc-pillar:nth-child(1) { transform: perspective(1000px) rotateY(6deg) translateZ(-6px); }
.naigc-pillars-left .naigc-pillar:nth-child(2) { transform: perspective(1000px) rotateY(6deg) translateZ(8px); }
.naigc-pillars-left .naigc-pillar:nth-child(3) { transform: perspective(1000px) rotateY(6deg) translateZ(12px); }
.naigc-pillars-left .naigc-pillar:nth-child(4) { transform: perspective(1000px) rotateY(6deg) translateZ(-2px); }

.naigc-pillars-right .naigc-pillar:nth-child(1) { transform: perspective(1000px) rotateY(-6deg) translateZ(-6px); }
.naigc-pillars-right .naigc-pillar:nth-child(2) { transform: perspective(1000px) rotateY(-6deg) translateZ(8px); }
.naigc-pillars-right .naigc-pillar:nth-child(3) { transform: perspective(1000px) rotateY(-6deg) translateZ(12px); }
.naigc-pillars-right .naigc-pillar:nth-child(4) { transform: perspective(1000px) rotateY(-6deg) translateZ(-2px); }

/* Outer Polygon Border Frame */
.naigc-pillar-border {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 1.5px;
  position: relative;
  clip-path: polygon(
    14px 0%,
    calc(100% - 14px) 0%,
    100% 14px,
    100% calc(100% - 14px),
    calc(100% - 14px) 100%,
    14px 100%,
    0% calc(100% - 14px),
    0% 14px
  );
  transition: all 0.3s ease;
}

.naigc-theme-cyan .naigc-pillar-border {
  background: var(--naigc-cyan-border);
  filter: drop-shadow(0 4px 14px rgba(0, 217, 255, 0.28));
}

.naigc-theme-violet .naigc-pillar-border {
  background: var(--naigc-violet-border);
  filter: drop-shadow(0 4px 14px rgba(168, 85, 247, 0.28));
}

/* High-Contrast Smoked Glass Surface — IDENTICAL FOR ALL 8 PILLARS */
.naigc-pillar-surface {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  background: var(--naigc-surface-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  clip-path: polygon(
    13px 0%,
    calc(100% - 13px) 0%,
    100% 13px,
    100% calc(100% - 13px),
    calc(100% - 13px) 100%,
    13px 100%,
    0% calc(100% - 13px),
    0% 13px
  );
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.65rem 1.15rem;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), 
              inset 0 -1px 2px rgba(0, 0, 0, 0.5),
              0 12px 32px rgba(0, 8, 24, 0.5);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Micro-Grid Texture */
.naigc-pillar-grid {
  position: absolute;
  inset: 0;
  background-image: 
    repeating-linear-gradient(0deg, rgba(0, 217, 255, 0.04) 0px, rgba(0, 217, 255, 0.04) 1px, transparent 1px, transparent 4px),
    linear-gradient(90deg, rgba(0, 217, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 4px, 16px 100%;
  pointer-events: none;
  z-index: 1;
}

/* Scanning Light Beam */
.naigc-pillar-beam {
  position: absolute;
  top: -50%;
  left: 0;
  right: 0;
  height: 18px;
  pointer-events: none;
  z-index: 2;
  animation: naigc-beam-sweep 4.5s infinite ease-in-out;
}

.naigc-theme-cyan .naigc-pillar-beam {
  background: linear-gradient(180deg, transparent, rgba(0, 217, 255, 0.22), transparent);
}

.naigc-theme-violet .naigc-pillar-beam {
  background: linear-gradient(180deg, transparent, rgba(168, 85, 247, 0.22), transparent);
}

@keyframes naigc-beam-sweep {
  0% { top: -50%; }
  50% { top: 120%; }
  100% { top: 120%; }
}

/* Faceted Hexagonal Icon Chamber */
.naigc-pillar-icon-box {
  width: 44px;
  height: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  position: relative;
  z-index: 5;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.naigc-theme-cyan .naigc-pillar-icon-box {
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.22) 0%, rgba(6, 24, 58, 0.9) 100%);
  border: 1px solid rgba(0, 217, 255, 0.5);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 14px rgba(0, 217, 255, 0.25);
  color: #00D9FF;
}

.naigc-theme-violet .naigc-pillar-icon-box {
  background: linear-gradient(135deg, rgba(192, 132, 252, 0.22) 0%, rgba(24, 8, 48, 0.9) 100%);
  border: 1px solid rgba(192, 132, 252, 0.5);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 14px rgba(168, 85, 247, 0.25);
  color: #C084FC;
}

.naigc-pillar-icon-box svg {
  width: 21px;
  height: 21px;
  filter: drop-shadow(0 0 5px currentColor);
}

/* Typography & Content Block */
.naigc-pillar-body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.22rem;
  flex: 1;
  min-width: 0;
  z-index: 5;
  text-align: left;
}

.naigc-pillar-title-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.naigc-pillar-tag {
  font-family: var(--mq4-font-pixel, monospace);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 2px;
  flex-shrink: 0;
}

.naigc-theme-cyan .naigc-pillar-tag {
  background: rgba(0, 217, 255, 0.18);
  border: 1px solid rgba(0, 217, 255, 0.45);
  box-shadow: 0 0 6px rgba(0, 217, 255, 0.25);
  color: #00D9FF;
}

.naigc-theme-violet .naigc-pillar-tag {
  background: rgba(168, 85, 247, 0.18);
  border: 1px solid rgba(168, 85, 247, 0.45);
  box-shadow: 0 0 6px rgba(168, 85, 247, 0.25);
  color: #C084FC;
}

.naigc-pillar-title {
  margin: 0;
  font-family: var(--mq4-font, system-ui, sans-serif);
  color: #FFFFFF !important;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
  transition: color 0.25s ease;
}

.naigc-pillar-desc {
  margin: 0;
  color: #CBD5E1 !important;
  font-size: 0.72rem;
  font-weight: 500;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  transition: color 0.25s ease;
}

.naigc-pillar-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  flex-shrink: 0;
  opacity: 0.45;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 5;
}

.naigc-theme-cyan .naigc-pillar-arrow {
  color: #00D9FF;
}

.naigc-theme-violet .naigc-pillar-arrow {
  color: #C084FC;
}

/* ==========================================================================
   HOVER & INTERACTION (DIMENSIONAL SUSPENDED FLOAT)
   ========================================================================== */

.naigc-pillar:hover {
  transform: perspective(1000px) rotateY(0deg) translateZ(20px) translateY(-3px) scale(1.02) !important;
}

.naigc-theme-cyan:hover .naigc-pillar-border {
  background: linear-gradient(135deg, #00D9FF 0%, #38BDF8 50%, #00D9FF 100%);
  filter: drop-shadow(0 0 16px rgba(0, 217, 255, 0.65)) drop-shadow(0 0 32px rgba(0, 217, 255, 0.35));
}

.naigc-theme-violet:hover .naigc-pillar-border {
  background: linear-gradient(135deg, #C084FC 0%, #E879F9 50%, #C084FC 100%);
  filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65)) drop-shadow(0 0 32px rgba(168, 85, 247, 0.35));
}

.naigc-pillar:hover .naigc-pillar-surface {
  background: linear-gradient(135deg, rgba(12, 32, 72, 0.92) 0%, rgba(6, 18, 48, 0.96) 100%);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4), 0 18px 44px rgba(0, 10, 32, 0.6);
}

.naigc-pillar:hover .naigc-pillar-icon-box {
  transform: scale(1.06);
}

.naigc-theme-cyan:hover .naigc-pillar-icon-box {
  box-shadow: 0 0 18px rgba(0, 217, 255, 0.7);
}

.naigc-theme-violet:hover .naigc-pillar-icon-box {
  box-shadow: 0 0 18px rgba(168, 85, 247, 0.7);
}

.naigc-pillar:hover .naigc-pillar-desc {
  color: #FFFFFF !important;
}

.naigc-pillar:hover .naigc-pillar-arrow {
  opacity: 1;
  transform: translateX(4px);
  filter: drop-shadow(0 0 6px currentColor);
}

/* ==========================================================================
   RESPONSIVE DESIGN (DESKTOP & MOBILE WIDTHS)
   ========================================================================== */

@media (max-width: 1280px) {
  .naigc-pillars-container {
    grid-template-columns: minmax(310px, 360px) 1fr minmax(310px, 360px);
    padding: 0 1rem;
  }
  .naigc-pillar {
    height: 80px;
    transform: none !important;
  }
  .naigc-pillar-title {
    font-size: 0.82rem;
  }
  .naigc-pillar-desc {
    font-size: 0.68rem;
  }
  .naigc-pillar-icon-box {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }
  .naigc-pillar-icon-box svg {
    width: 18px;
    height: 18px;
  }
}

@media (max-width: 860px) {
  .naigc-pillars-container {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: auto;
    max-height: none;
    padding-bottom: 2rem;
    gap: 0.75rem;
  }
  .naigc-pillars-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    width: 100%;
  }
  .naigc-pillars-center {
    display: none;
  }
  .naigc-pillar {
    height: 72px;
    transform: none !important;
  }
  .naigc-pillar-surface {
    padding: 0.5rem 0.75rem !important;
    gap: 0.65rem;
  }
  .naigc-pillar-icon-box {
    width: 34px;
    height: 34px;
    min-width: 34px;
  }
  .naigc-pillar-icon-box svg {
    width: 16px;
    height: 16px;
  }
  .naigc-pillar-title {
    font-size: 0.75rem;
  }
  .naigc-pillar-desc {
    display: none;
  }
  .naigc-pillar-arrow {
    display: none;
  }
}

.naigc-pillar {
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  will-change: transform;
}

.naigc-pillar.is-card-tilted {
  transition: transform 0.08s ease-out;
}

    <h1>MemoryQuest: arcade photo booth hire for your party</h1>

        <li><strong>Cartoon</strong>: your photo in a drawing style.</li>
        <li><strong>Karaoke</strong>: sing along, recorded.</li>
        <li><strong>Quizbattle</strong>: your own questions, answered with A, B, C or D, with a leaderboard.</li>

        <li><strong>Basic</strong>: €275 per day. Photo, video, boomerang, audio, challenges, backgrounds and classic effects. 3 backgrounds of your own (1 of them made with AI) and 1 frame of your own.</li>

/**
 * LUSION.CO SCREENPAINT ENGINE — LIQUID IRIDESCENT RIBBON & CHROMATIC ABERRATION
 * Recreates the exact signature effect from lusion.co/projects:
 * - Fluid ribbon spline trailing the cursor
 * - Multi-pass spectral chromatic aberration (Cyan, Magenta, Amber, Liquid Specular)
 * - Organic dissipation & curl noise physics
 * - Native pointer responsiveness (zero lag)
 */
(function initLusionScreenPaint() {
  if (typeof window === "undefined") return;

  // Create High-Performance GPU Canvas
  const canvas = document.createElement("canvas");
  canvas.id = "lusion-screenpaint-canvas";
  canvas.setAttribute("aria-hidden", "true");
  document.body.appendChild(canvas);

  const ctx = canvas.getContext("2d", { alpha: true });
  let width = (canvas.width = window.innerWidth * window.devicePixelRatio || 1);
  let height = (canvas.height = window.innerHeight * window.devicePixelRatio || 1);
  const dpr = window.devicePixelRatio || 1;

  function resize() {
    width = canvas.width = window.innerWidth * dpr;
    height = canvas.height = window.innerHeight * dpr;
  }
  window.addEventListener("resize", resize, { passive: true });

  // Mouse State & Trail Buffer
  const points = [];
  const TRAIL_LIFETIME = 850;
  const BASE_WIDTH = 12 * dpr;
  let mouseX = -1000, mouseY = -1000;
  let prevMouseX = -1000, prevMouseY = -1000;
  let isMoving = false;
  let moveTimeout = null;

  window.addEventListener("pointermove", (e) => {
    const curX = e.clientX * dpr;
    const curY = e.clientY * dpr;

    if (prevMouseX < 0) {
      prevMouseX = curX;
      prevMouseY = curY;
    }

    const vx = curX - prevMouseX;
    const vy = curY - prevMouseY;
    const speed = Math.hypot(vx, vy);

    if (speed > 1.5) {
      points.push({
        x: curX,
        y: curY,
        vx: vx,
        vy: vy,
        speed: speed,
        age: 0,
        birth: performance.now(),
        noiseOffset: (Math.random() - 0.5) * 6 * dpr
      });
      prevMouseX = curX;
      prevMouseY = curY;
    }

    mouseX = curX;
    mouseY = curY;
    isMoving = true;
    clearTimeout(moveTimeout);
    moveTimeout = setTimeout(() => { isMoving = false; }, 100);
  }, { passive: true });

  // 3D Tilt on Pillar Cards
  function bindPillarCards() {
    const cards = document.querySelectorAll(".naigc-pillar");
    cards.forEach((card) => {
      if (card.dataset.tiltBound) return;
      card.dataset.tiltBound = "true";

      card.addEventListener("pointerenter", () => {
        card.classList.add("is-card-tilted");
      });

      card.addEventListener("pointermove", (e) => {
        const rect = card.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = rect.top + rect.height / 2;
        const normX = (e.clientX - cardCenterX) / (rect.width / 2);
        const normY = (e.clientY - cardCenterY) / (rect.height / 2);
        const tiltX = -normY * 7;
        const tiltY = normX * 7;
        card.style.transform = `perspective(1000px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) translateZ(12px)`;
      });

      card.addEventListener("pointerleave", () => {
        card.classList.remove("is-card-tilted");
        card.style.transform = "";
      });
    });
  }
  bindPillarCards();
  const obs = new MutationObserver(bindPillarCards);
  obs.observe(document.body, { childList: true, subtree: true });

  // 60-120FPS Render Loop: Liquid Chromatic Spline Trail
  function render(now) {
    requestAnimationFrame(render);

    // Prune expired points
    while (points.length > 0 && (now - points[0].birth) > TRAIL_LIFETIME) {
      points.shift();
    }

    ctx.clearRect(0, 0, width, height);

    if (points.length < 3) return;

    // Multi-pass Chromatic Aberration Drawing
    // Pass 1: Magenta / Violet Fringe (+offset)
    // Pass 2: Cyan / Ice-Blue Fringe (-offset)
    // Pass 3: Radiant Liquid White Core
    const passes = [
      { color: "rgba(255, 45, 160, ", shift: 1.8 * dpr, blur: 8 * dpr },
      { color: "rgba(0, 235, 255, ", shift: -1.8 * dpr, blur: 7 * dpr },
      { color: "rgba(255, 255, 255, ", shift: 0, blur: 3 * dpr }
    ];

    passes.forEach((p) => {
      ctx.save();
      ctx.shadowBlur = p.blur;
      ctx.shadowColor = p.color + "0.6)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = 1; i < points.length; i++) {
        const p0 = points[i - 1];
        const p1 = points[i];

        const progress0 = Math.max(0, 1 - (now - p0.birth) / TRAIL_LIFETIME);
        const progress1 = Math.max(0, 1 - (now - p1.birth) / TRAIL_LIFETIME);
        const alpha = Math.min(progress0, progress1) * 0.85;

        if (alpha <= 0.01) continue;

        // Compute normal vector for chromatic shift & curl
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        // Dynamic width: fluid taper based on age and speed
        const w0 = Math.max(1.5 * dpr, BASE_WIDTH * Math.pow(progress0, 0.85) * Math.min(1.8, 0.8 + p0.speed * 0.016));
        const w1 = Math.max(1.5 * dpr, BASE_WIDTH * Math.pow(progress1, 0.85) * Math.min(1.8, 0.8 + p1.speed * 0.016));
        const avgWidth = (w0 + w1) * 0.5;

        // Slight curl displacement over lifetime
        const curlPhase = (now - p0.birth) * 0.005;
        const curl = Math.sin(curlPhase) * p0.noiseOffset * (1 - progress0);

        const x0 = p0.x + nx * (p.shift + curl);
        const y0 = p0.y + ny * (p.shift + curl);
        const x1 = p1.x + nx * (p.shift + curl);
        const y1 = p1.y + ny * (p.shift + curl);

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = p.shift === 0 ? avgWidth * 0.65 : avgWidth;
        ctx.strokeStyle = p.color + (alpha * (p.shift === 0 ? 0.95 : 0.75)) + ")";
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  requestAnimationFrame(render);
})();
</script>

<script>
/**
 * NAIGC SCROLL BOUNDARY ENFORCER
 * Ensures the user can only scroll up to the 8 Pillars & Cyborg showcase part,
 * strictly preventing scrolling past this section.
 */
(function lockScrollBoundary() {
  function getPillarsBottom() {
    const pillars = document.getElementById('naigc-pillars');
    if (!pillars) return null;
    const rect = pillars.getBoundingClientRect();
    return window.scrollY + rect.bottom;
  }

  function clampScroll() {
    const pillarsBottom = getPillarsBottom();
    if (!pillarsBottom) return;
    const maxScroll = Math.max(0, pillarsBottom - window.innerHeight + 30);
    if (window.scrollY > maxScroll) {
      window.scrollTo({ top: maxScroll, behavior: 'instant' });
    }
  }

  window.addEventListener('scroll', clampScroll, { passive: true });
  window.addEventListener('resize', clampScroll, { passive: true });
  window.addEventListener('load', clampScroll, { passive: true });
})();
</script>
